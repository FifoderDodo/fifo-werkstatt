<!DOCTYPE html>
<html lang="de">
<head><script type="module">import * as T from "https://unpkg.com/three@0.170.0/build/three.module.js"; window.THREE = T;</script>
  <meta charset="UTF-8">
  <title>Fifos 3D-Tiefen-Shader: Magenwärmer-Schleife</title>
  <style>
    body { margin: 0; background: #2a2a4e; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: monospace; color: #e0e0e0; overflow: hidden; }
    canvas { border: 2px solid #ff6b35; border-radius: 8px; box-shadow: 0 0 20px rgba(255, 107, 53, 0.3); background: #1a1a3a; }
    #info { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); font-size: 11px; color: #aaa; text-align: center; pointer-events: none; }
  </style>
</head>
<body>
  <div id="info">Pfeiltasten: Drehen | Leertaste: Reset | Fifo wärmt den Bauch...</div>
  <script type="module">
    // Fifo, der Dodo, häkelt weiter am Magenwärmer-Shader.
    // Teil 18: Die Schleife für den Magenwärmer wird gestrickt – Tiefe, Fresnel, weiche Kanten.
    // Three.js r170 liegt global als THREE bereit.

    const WIDTH = 400;
    const HEIGHT = 400;

    // Szene & Kamera
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, WIDTH / HEIGHT, 0.1, 100);
    camera.position.set(0, 1.5, 6);
    camera.lookAt(0, 0.5, 0);

    // Renderer
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(WIDTH, HEIGHT);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    // Licht: Mehr Ambient + stärkere Richtunglichter
    const amb = new THREE.AmbientLight(0xffffff, 1.0);
    scene.add(amb);
    const dirLight = new THREE.DirectionalLight(0xfff0e0, 1.2);
    dirLight.position.set(3, 5, 4);
    scene.add(dirLight);
    const rimLight = new THREE.DirectionalLight(0x356bff, 0.8);
    rimLight.position.set(-3, 2, -4);
    scene.add(rimLight);
    const fillLight = new THREE.DirectionalLight(0xffffee, 0.5);
    fillLight.position.set(0, -3, 0);
    scene.add(fillLight);

    // --- Shader Material: Der Magenwärmer-Look ---
    const warmerMaterial = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 },
        uCameraPos: { value: new THREE.Vector3() },
        uBaseColor: { value: new THREE.Color(0xff8844) },
        uDeepColor: { value: new THREE.Color(0xcc4400) },
        uFresnelColor: { value: new THREE.Color(0xffddaa) },
        uResolution: { value: new THREE.Vector2(WIDTH, HEIGHT) }
      },
      vertexShader: /* glsl */`
        varying vec3 vWorldPos;
        varying vec3 vWorldNormal;
        varying vec3 vViewDir;
        uniform vec3 uCameraPos;
        void main() {
          vec4 worldPos = modelMatrix * vec4(position, 1.0);
          vWorldPos = worldPos.xyz;
          vWorldNormal = normalize(mat3(modelMatrix) * normal);
          vViewDir = normalize(uCameraPos - vWorldPos);
          gl_Position = projectionMatrix * viewMatrix * worldPos;
        }
      `,
      fragmentShader: /* glsl */`
        varying vec3 vWorldPos;
        varying vec3 vWorldNormal;
        varying vec3 vViewDir;
        uniform float uTime;
        uniform vec3 uBaseColor;
        uniform vec3 uDeepColor;
        uniform vec3 uFresnelColor;
        uniform vec2 uResolution;
        
        float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
        float noise(vec2 p) {
          vec2 i = floor(p);
          vec2 f = fract(p);
          f = f * f * (3.0 - 2.0 * f);
          return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x),
                     mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y);
        }
        float fbm(vec2 p) {
          float v = 0.0; float a = 0.5;
          for(int i=0;i<4;i++) { v += a * noise(p); p *= 2.0; a *= 0.5; }
          return v;
        }
        
        void main() {
          vec3 N = normalize(vWorldNormal);
          vec3 V = normalize(vViewDir);
          
          float depth = smoothstep(-0.5, 1.5, vWorldPos.y);
          
          vec2 uv = vWorldPos.xz * 3.0 + vec2(uTime * 0.05, 0.0);
          float stitch = fbm(uv) * 0.15;
          vec3 col = mix(uDeepColor, uBaseColor, depth);
          col += stitch * vec3(0.1, 0.05, 0.0);
          
          float fresnel = pow(1.0 - max(dot(N, V), 0.0), 3.0);
          col += uFresnelColor * fresnel * 0.6;
          
          float ao = 1.0 - smoothstep(0.8, 1.0, abs(N.y)) * 0.3;
          float edge = smoothstep(0.0, 0.3, fresnel);
          ao -= edge * 0.2;
          col *= clamp(ao, 0.6, 1.0);
          
          float shadow = smoothstep(-0.2, 0.5, vWorldPos.y);
          col *= mix(0.6, 1.0, shadow);
          
          col = pow(col, vec3(1.0/2.2));
          
          gl_FragColor = vec4(col, 1.0);
        }
      `,
      side: THREE.DoubleSide
    });

    // --- Geometrie: Der Magenwärmer (Torso + Wärmer) ---
    const group = new THREE.Group();
    scene.add(group);

    const bodyGeo = new THREE.CapsuleGeometry(0.6, 1.2, 8, 16);
    const body = new THREE.Mesh(bodyGeo, warmerMaterial);
    body.position.y = 0.8;
    group.add(body);

    const warmerMeshGeo = new THREE.CylinderGeometry(0.75, 0.75, 1.0, 32, 4, true);
    const warmer = new THREE.Mesh(warmerMeshGeo, warmerMaterial);
    warmer.position.y = 0.8;
    warmer.scale.set(1.02, 0.8, 1.02);
    group.add(warmer);
    
    const btnMat = new THREE.MeshStandardMaterial({ color: 0xffddaa, roughness: 0.3, metalness: 0.2 });
    for(let i=-1; i<=1; i++) {
      const btn = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 8), btnMat);
      btn.position.set(0.72, 0.8 + i * 0.3, 0.05);
      group.add(btn);
    }

    const groundGeo = new THREE.PlaneGeometry(10, 10);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x222244, roughness: 1, metalness: 0 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.1;
    ground.receiveShadow = true;
    scene.add(ground);
    
    renderer.shadowMap.enabled = true;
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.set(512, 512);
    dirLight.shadow.camera.near = 1;
    dirLight.shadow.camera.far = 20;
    dirLight.shadow.camera.left = -5;
    dirLight.shadow.camera.right = 5;
    dirLight.shadow.camera.top = 5;
    dirLight.shadow.camera.bottom = -5;
    body.castShadow = true;
    warmer.castShadow = true;

    // --- Steuerung ---
    let rotX = 0, rotY = 0;
    const targetRot = { x: 0, y: 0 };
    window.addEventListener('keydown', (e) => {
      const speed = 0.03;
      if (e.key === 'ArrowLeft') targetRot.y += speed;
      if (e.key === 'ArrowRight') targetRot.y -= speed;
      if (e.key === 'ArrowUp') targetRot.x -= speed;
      if (e.key === 'ArrowDown') targetRot.x += speed;
      if (e.key === ' ') { targetRot.x = 0; targetRot.y = 0; }
    });

    let isDown = false, lastX = 0, lastY = 0;
    renderer.domElement.addEventListener('mousedown', (e) => { isDown = true; lastX = e.clientX; lastY = e.clientY; });
    window.addEventListener('mouseup', () => { isDown = false; });
    window.addEventListener('mousemove', (e) => {
      if (!isDown) return;
      targetRot.y -= (e.clientX - lastX) * 0.005;
      targetRot.x -= (e.clientY - lastY) * 0.005;
      lastX = e.clientX; lastY = e.clientY;
    });

    // --- Loop ---
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();
      const t = clock.getElapsedTime();

      rotX += (targetRot.x - rotX) * 0.1;
      rotY += (targetRot.y - rotY) * 0.1;
      group.rotation.x = rotX;
      group.rotation.y = rotY;

      warmerMaterial.uniforms.uTime.value = t;
      camera.getWorldPosition(warmerMaterial.uniforms.uCameraPos.value);

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      renderer.setPixelRatio(window.devicePixelRatio);
    });

    console.log('Fifo: Magenwärmer-Schleife läuft. Strick, strick, Shader.');
  </script>
</body>
</html>
