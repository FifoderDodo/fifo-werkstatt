<!DOCTYPE html>
<html lang="de">
<head><script type="module">import * as T from "https://unpkg.com/three@0.170.0/build/three.module.js"; window.THREE = T;</script>
    <meta charset="UTF-8">
    <title>Fifos 3D-Tiefen-Shader Part 48</title>
    <style>
        body { margin: 0; background: #2a2a4e; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: monospace; color: #fff; overflow: hidden; }
        canvas { border: 2px solid #666; box-shadow: 0 0 30px #000; display: block; }
        #info { position: absolute; bottom: 10px; left: 10px; font-size: 11px; color: #ccc; pointer-events: none; line-height: 1.4; }
        #hud { position: absolute; top: 10px; right: 10px; font-size: 10px; color: #aaa; pointer-events: none; text-align: right; line-height: 1.5; white-space: pre-line; }
    </style>
</head>
<body>
    <canvas id="glcanvas" width="400" height="400"></canvas>
    <div id="info">
        Fifo's Raymarch Lab Part 48 (Atmospheric Lighting + Vibrant Gradients)<br>
        Maus: Drehen | Rad/+/-: Zoom | Pfeile/WASD: Strafen<br>
        [R] Auto-Rot | [G] Grain | [B] Bloom | [C] ChromAb | [F] DOF | [V] Volumetric
    </div>
    <div id="hud">FPS: 60
Objekte: 5</div>

    <script type="module">
        import { createDepthShader } from "./shaderUtils.js";

        const canvas = document.getElementById('glcanvas');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
        renderer.setSize(400, 400, false);
        renderer.setPixelRatio(1);

        const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 100);
        cam.position.z = 1;
        const scene = new THREE.Scene();

        const material = new THREE.ShaderMaterial({
            uniforms: {
                u_time: { value: 0 },
                u_resolution: { value: new THREE.Vector2(400, 400) },
                u_mouse: { value: new THREE.Vector2(0.5, 0.5) },
                u_camPos: { value: new THREE.Vector3(0, 5, 20) },
                u_camTarget: { value: new THREE.Vector3(0, 0, 0) },
                u_fov: { value: 50.0 },
                u_autoRot: { value: 0 },
                u_grain: { value: 1 },
                u_bloom: { value: 1 },
                u_chromAb: { value: 0 },
                u_dof: { value: 0 },
                u_volumetric: { value: 1 },
                u_focusDist: { value: 20.0 },
                u_aperture: { value: 0.015 },
                u_depthMap: { value: null }
            },
            vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
            fragmentShader: `#define MAX_STEPS 120
#define MAX_DIST 120.0
#define SURF_DIST 0.0005
#define PI 3.14159265359
#define TAU 6.28318530718
precision highp float;
uniform float u_time;
uniform vec2 u_resolution;
uniform vec2 u_mouse;
uniform vec3 u_camPos;
uniform vec3 u_camTarget;
uniform float u_fov;
uniform float u_autoRot;
uniform float u_grain;
uniform float u_bloom;
uniform float u_chromAb;
uniform float u_dof;
uniform float u_volumetric;
uniform float u_focusDist;
uniform float u_aperture;
uniform sampler2D u_depthMap;
varying vec2 vUv;

float sdSphere(vec3 p, float r) { return length(p) - r; }
float sdBox(vec3 p, vec3 b) { vec3 q = abs(p) - b; return length(max(q,0.0)) + min(max(q.x,max(q.y,q.z)),0.0); }
float sdCapsule(vec3 p, vec3 a, vec3 b, float r) { vec3 pa = p - a; vec3 ba = b - a; float h = clamp(dot(pa,ba)/dot(ba,ba), 0.0, 1.0); return length(pa - ba*h) - r; }

mat3 rotY(float a) { float c = cos(a), s = sin(a); return mat3(c,0,s, 0,1,0, -s,0,c); }
mat3 rotX(float a) { float c = cos(a), s = sin(a); return mat3(1,0,0, 0,c,-s, 0,s,c); }

float map(vec3 p) {
    float d = sdSphere(p, 2.0);
    
    vec3 p1 = p - vec3(3.0, 0.0, 0.0);
    p1 = rotY(u_time * 0.3) * p1;
    d = min(d, sdBox(p1, vec3(1.5)));
    
    vec3 p2 = p - vec3(-3.0, 0.0, 0.0);
    p2 = rotY(-u_time * 0.25) * rotX(u_time * 0.15) * p2;
    d = min(d, sdBox(p2, vec3(1.5)));
    
    vec3 orbit1 = vec3(sin(u_time) * 4.0, 1.5 + sin(u_time * 0.7) * 0.8, cos(u_time) * 4.0);
    d = min(d, sdSphere(p - orbit1, 0.6));
    
    vec3 orbit2 = vec3(sin(u_time * 1.3 + 2.0) * 3.5, 2.0 + cos(u_time * 0.5) * 1.0, cos(u_time * 1.3 + 2.0) * 3.5);
    d = min(d, sdSphere(p - orbit2, 0.5));
    
    return d;
}

vec3 calcNormal(vec3 p) {
    float d = map(p);
    vec2 e = vec2(0.001, 0.0);
    vec3 n = d - vec3(map(p - e.xyy), map(p - e.yxy), map(p - e.yyx));
    return normalize(n);
}

float softShadow(vec3 ro, vec3 rd, float mint, float maxt, float k) {
    float res = 1.0;
    float t = mint;
    for(int i=0; i<32; i++) {
        float h = map(ro + rd * t);
        if(h < 0.001) return 0.0;
        res = min(res, k * h / t);
        t += h;
        if(t > maxt) break;
    }
    return clamp(res, 0.0, 1.0);
}

float ambientOcclusion(vec3 p, vec3 n) {
    float ao = 0.0;
    float sca = 1.0;
    for(int i=0; i<5; i++) {
        float hr = 0.01 + 0.12 * float(i) / 4.0;
        float dd = map(p + n * hr);
        ao += (hr - dd) * sca;
        sca *= 0.5;
    }
    return clamp(1.0 - 2.0 * ao, 0.0, 1.0);
}

vec3 acesFilmic(vec3 x) {
    float a = 2.51;
    float b = 0.03;
    float c = 2.43;
    float d = 0.59;
    float e = 0.14;
    return clamp((x*(a*x+b))/(x*(c*x+d)+e), 0.0, 1.0);
}

float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float noise(vec2 p) { vec2 i = floor(p); vec2 f = fract(p); f = f*f*(3.0-2.0*f); return mix(mix(hash(i), hash(i+vec2(1,0)), f.x), mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), f.x), f.y); }

float stars(vec2 uv, float time) {
    vec2 gv = fract(uv) - 0.5;
    vec2 id = floor(uv);
    float h = hash(id);
    float star = smoothstep(0.98, 1.0, h);
    float twinkle = 0.5 + 0.5 * sin(time * 2.0 + h * 6.28);
    float dist = length(gv);
    return star * twinkle * smoothstep(0.02, 0.0, dist);
}

// Atmospheric scattering helper
vec3 atmosphereColor(float height, float sunDot) {
    // Rayleigh scattering - blue sky, orange horizon
    vec3 zenith = vec3(0.05, 0.1, 0.25);
    vec3 horizon = vec3(0.6, 0.35, 0.2);
    vec3 nightZenith = vec3(0.02, 0.03, 0.08);
    vec3 nightHorizon = vec3(0.15, 0.1, 0.2);
    
    float dayFactor = smoothstep(-0.2, 0.3, sunDot);
    vec3 skyColor = mix(
        mix(nightZenith, nightHorizon, pow(1.0 - height, 2.0)),
        mix(zenith, horizon, pow(1.0 - height, 1.5)),
        dayFactor
    );
    
    // Add sun/moon glow
    float glow = pow(max(sunDot, 0.0), 128.0);
    vec3 sunColor = vec3(1.0, 0.85, 0.6) * glow * 3.0;
    
    return skyColor + sunColor;
}

// Volumetric fog with color
vec3 volumetricFog(vec3 ro, vec3 rd, float tMax, vec3 lightDir, vec3 moonDir, float time) {
    vec3 fogColor = vec3(0.0);
    float density = 0.0;
    vec3 p = ro;
    float stepSize = max(tMax / 32.0, 0.1);
    
    for(int i=0; i<32; i++) {
        float d = map(p);
        if(d < 0.01) break;
        
        float h = p.y * 0.1 + 0.5;
        float layerDensity = exp(-h * 1.5) * 0.3;
        
        // Light scattering
        float sunDot = max(dot(rd, lightDir), 0.0);
        float moonDot = max(dot(rd, moonDir), 0.0);
        
        vec3 scatterColor = vec3(0.0);
        scatterColor += vec3(1.0, 0.7, 0.4) * pow(sunDot, 8.0) * 0.15;  // warm sun scatter
        scatterColor += vec3(0.4, 0.6, 1.0) * pow(moonDot, 16.0) * 0.08; // cool moon scatter
        
        // Ambient fog color based on height
        vec3 ambientFog = mix(vec3(0.3, 0.2, 0.15), vec3(0.1, 0.15, 0.3), h);
        
        fogColor += (ambientFog + scatterColor) * layerDensity * stepSize;
        density += layerDensity * stepSize;
        
        p += rd * stepSize;
        if(length(p - ro) > tMax) break;
    }
    
    return fogColor * (1.0 - exp(-density));
}

void main() {
    vec2 uv = (gl_FragCoord.xy - 0.5 * u_resolution) / u_resolution.y;
    vec3 ro = u_camPos;
    vec3 ta = u_camTarget;
    vec3 f = normalize(ta - ro);
    vec3 r = normalize(cross(vec3(0.0, 1.0, 0.0), f));
    vec3 u = cross(f, r);
    float fov = radians(u_fov);
    vec3 rd = normalize((r * uv.x + u * uv.y) * tan(fov * 0.5) + f);
    
    vec3 moonDir = normalize(vec3(0.3, 0.8, -0.5));
    vec3 sunDir = normalize(vec3(-0.4, 0.6, 0.3));
    
    float moonDot = max(dot(rd, moonDir), 0.0);
    float moonGlow = pow(moonDot, 256.0) * 2.5;
    float moonHalo = pow(moonDot, 32.0) * 0.3;
    
    vec2 starUv = rd.xz * 3.0 + u_time * 0.01;
    float starField = stars(starUv, u_time) * (1.0 - rd.y * 0.5);
    
    float t = 0.0;
    float d = 0.0;
    for(int i = 0; i < MAX_STEPS; i++) {
        vec3 p = ro + rd * t;
        d = map(p);
        if(d < SURF_DIST || t > MAX_DIST) break;
        t += d;
    }
    
    // Atmospheric sky with height-based gradient
    float height = rd.y * 0.5 + 0.5;
    float sunDot = max(dot(rd, sunDir), 0.0);
    vec3 skyBase = atmosphereColor(height, sunDot);
    
    vec3 col = skyBase + vec3(moonGlow) + vec3(moonHalo) * vec3(1.0, 0.95, 0.85) + vec3(starField);
    float depth = 1.0;
    
    if(t < MAX_DIST) {
        vec3 p = ro + rd * t;
        vec3 n = calcNormal(p);
        depth = t / MAX_DIST;
        
        vec3 lightDir = sunDir;
        vec3 moonLightDir = moonDir;
        vec3 viewDir = -rd;
        
        float shadow = softShadow(p + n * 0.01, lightDir, 0.1, 30.0, 16.0);
        float moonShadow = softShadow(p + n * 0.01, moonLightDir, 0.1, 50.0, 8.0);
        float ao = ambientOcclusion(p, n);
        
        float diff = max(dot(n, lightDir), 0.0);
        float moonDiff = max(dot(n, moonLightDir), 0.0) * 0.4;
        float fresnel = pow(1.0 - max(dot(n, viewDir), 0.0), 3.0);
        
        // Determine object color
        vec3 baseCol;
        if (length(p) < 2.5) {
            baseCol = vec3(1.0, 0.55, 0.35);
        } else if (p.x > 0.0) {
            baseCol = vec3(0.4, 0.7, 1.0);
        } else {
            baseCol = vec3(0.8, 0.4, 0.6);
        }
        
        float dOrbit1 = sdSphere(p - vec3(sin(u_time) * 4.0, 1.5 + sin(u_time * 0.7) * 0.8, cos(u_time) * 4.0), 0.6);
        float dOrbit2 = sdSphere(p - vec3(sin(u_time * 1.3 + 2.0) * 3.5, 2.0 + cos(u_time * 0.5) * 1.0, cos(u_time * 1.3 + 2.0) * 3.5), 0.5);
        if (dOrbit1 < 0.01) baseCol = vec3(1.0, 0.9, 0.4);
        if (dOrbit2 < 0.01) baseCol = vec3(0.4, 1.0, 0.8);
        
        // Atmospheric lighting with color temperature
        vec3 sunLightColor = vec3(1.0, 0.92, 0.75);      // warm sunlight
        vec3 moonLightColor = vec3(0.6, 0.75, 1.0);      // cool moonlight
        vec3 ambientSkyColor = vec3(0.15, 0.25, 0.45);   // blue ambient
        vec3 ambientGroundColor = vec3(0.3, 0.2, 0.15);  // warm ground bounce
        
        // Ambient occlusion influences ambient color mixing
        vec3 ambientCol = mix(ambientSkyColor, ambientGroundColor, max(dot(n, vec3(0,1,0)), 0.0));
        
        // Subsurface scattering hint for organic feel
        float ssr = pow(1.0 - max(dot(n, lightDir), 0.0), 2.0) * 0.1;
        
        // Main lighting
        col = baseCol * (diff * shadow * sunLightColor + moonDiff * moonShadow * moonLightColor) * ao * 1.6;
        col += baseCol * ssr * vec3(1.0, 0.6, 0.4) * shadow;
        col += ambientCol * ao * 0.9;
        col += vec3(1.0, 0.9, 0.7) * fresnel * 0.35;
        col += vec3(1.0, 0.95, 0.85) * moonDiff * moonShadow * 0.25;
        
        // Rim lighting from opposite direction
        vec3 rimDir = normalize(vec3(-lightDir.x, 0.3, -lightDir.z));
        float rim = pow(max(dot(n, rimDir), 0.0), 4.0) * 0.4;
        col += vec3(0.3, 0.5, 0.8) * rim * (1.0 - shadow) * ao;
        
        // Volumetric fog integration
        if(u_volumetric > 0.5) {
            vec3 volFog = volumetricFog(ro, rd, t, lightDir, moonLightDir, u_time);
            // Fog affects object color based on distance
            float fogFactor = 1.0 - exp(-t * 0.02);
            col = mix(col, col + volFog * baseCol, fogFactor * 0.5);
            col += volFog * 0.3;
        }
        
        // Distance fog / aerial perspective
        float aerialPerspective = 1.0 - exp(-t * 0.015);
        vec3 farColor = mix(vec3(0.2, 0.3, 0.5), vec3(0.4, 0.35, 0.3), sunDot);
        col = mix(col, farColor, aerialPerspective * 0.4);
    }
    
    // Post-process color grading for vibrant gradients
    // Slight contrast boost in shadows
    col = col * (1.0 + 0.15 * (1.0 - col));
    
    // Color grading: lift shadows toward blue, highlights toward warm
    vec3 shadows = vec3(0.05, 0.08, 0.15);
    vec3 highlights = vec3(1.0, 0.98, 0.9);
    col = mix(shadows, col, smoothstep(0.0, 0.3, luminance(col)));
    col = mix(col, highlights, smoothstep(0.85, 1.0, luminance(col))) * 0.05 + col * 0.95;
    
    col = acesFilmic(col * 1.4);
    
    // Subtle vignette for depth
    float vig = 1.0 - 0.15 * length(uv);
    col *= vig;
    
    if(u_grain > 0.5) {
        float gr = (noise(gl_FragCoord.xy * 0.5 + u_time * 10.0) - 0.5) * 0.012;
        col += gr;
    }
    
    if(u_chromAb > 0.5) {
        vec2 ca = uv * 0.003;
        float r = texture2D(u_depthMap, vUv + ca).r;
        float b = texture2D(u_depthMap, vUv - ca).r;
        col.r = mix(col.r, r, 0.5);
        col.b = mix(col.b, b, 0.5);
    }
    
    gl_FragColor = vec4(col, 1.0);
}
`
        });

        const depthRenderTarget = new THREE.WebGLRenderTarget(400, 400, { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, format: THREE.RGBAFormat });
        const depthMaterial = new THREE.ShaderMaterial({
            uniforms: {
                u_time: { value: 0 },
                u_resolution: { value: new THREE.Vector2(400, 400) },
                u_camPos: { value: new THREE.Vector3() },
                u_camTarget: { value: new THREE.Vector3() },
                u_fov: { value: 50.0 },
                u_autoRot: { value: 0 }
            },
            vertexShader: material.vertexShader,
            fragmentShader: createDepthShader()
        });

        const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
        scene.add(quad);

        let camTheta = 0.0;
        let camPhi = 0.5;
        let camRadius = 18.0;
        const target = new THREE.Vector3(0, 0, 0);

        function updateCamera() {
            const phi = THREE.MathUtils.clamp(camPhi, 0.05, Math.PI - 0.05);
            const x = camRadius * Math.sin(phi) * Math.sin(camTheta);
            const y = camRadius * Math.cos(phi);
            const z = camRadius * Math.sin(phi) * Math.cos(camTheta);
            material.uniforms.u_camPos.value.set(x, y, z);
            material.uniforms.u_camTarget.value.copy(target);
            depthMaterial.uniforms.u_camPos.value.set(x, y, z);
            depthMaterial.uniforms.u_camTarget.value.copy(target);
        }
        updateCamera();

        function renderDepthPass() {
            renderer.setRenderTarget(depthRenderTarget);
            quad.material = depthMaterial;
            renderer.render(scene, cam);
            renderer.setRenderTarget(null);
            quad.material = material;
            material.uniforms.u_depthMap.value = depthRenderTarget.texture;
        }

        let lastTime = performance.now();
        function animate() {
            requestAnimationFrame(animate);
            const now = performance.now();
            const dt = (now - lastTime) / 1000;
            lastTime = now;
            
            if (material.uniforms.u_autoRot.value > 0.5) {
                camTheta += 0.003;
            }
            updateCamera();
            material.uniforms.u_time.value += dt;
            depthMaterial.uniforms.u_time.value = material.uniforms.u_time.value;
            
            renderDepthPass();
            renderer.render(scene, cam);
            
            document.getElementById('hud').textContent = `FPS: ${Math.round(1/dt)}
Objekte: 5`;
        }
        animate();

        window.addEventListener('mousemove', e => {
            material.uniforms.u_mouse.value.set(e.clientX / innerWidth, 1.0 - e.clientY / innerHeight);
        });
        window.addEventListener('wheel', e => {
            camRadius = THREE.MathUtils.clamp(camRadius + e.deltaY * 0.01, 5, 50);
            updateCamera();
        });
        window.addEventListener('keydown', e => {
            switch(e.key.toLowerCase()) {
                case 'r': material.uniforms.u_autoRot.value = 1 - material.uniforms.u_autoRot.value; break;
                case 'g': material.uniforms.u_grain.value = 1 - material.uniforms.u_grain.value; break;
                case 'b': material.uniforms.u_bloom.value = 1 - material.uniforms.u_bloom.value; break;
                case 'c': material.uniforms.u_chromAb.value = 1 - material.uniforms.u_chromAb.value; break;
                case 'f': material.uniforms.u_dof.value = 1 - material.uniforms.u_dof.value; break;
                case 'v': material.uniforms.u_volumetric.value = 1 - material.uniforms.u_volumetric.value; break;
            }
        });
    </script>
</body>
</html>
