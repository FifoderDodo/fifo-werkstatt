<!DOCTYPE html>
<html lang="de">
<head><script type="module">import * as T from "https://unpkg.com/three@0.170.0/build/three.module.js"; window.THREE = T;</script>
    <meta charset="UTF-8">
    <title>Fifos 3D-Tiefen-Shader Part 19</title>
    <style>
        body { margin: 0; background: #1a1a2e; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: monospace; color: #eee; overflow: hidden; }
        canvas { border: 2px solid #444; box-shadow: 0 0 30px #000; display: block; }
        #info { position: absolute; bottom: 10px; left: 10px; font-size: 11px; color: #aaa; pointer-events: none; line-height: 1.4; }
    </style>
</head>
<body>
    <canvas id="glcanvas" width="400" height="400"></canvas>
    <div id="info">
        Fifo's Raymarch Lab Part 19<br>
        Maus: Drehen | Rad/+/-: Zoom | Pfeile/WASD: Strafen<br>
        Shader: SDF Raymarch, Weiche Schatten, AO, Fresnel, Nebel, Kamera zurück
    </div>

    <script type="module">
        // -----------------------------------------------------------
        // Fifo der Dodo watschelt hier rein und baut die GPU-Welt.
        // Kein Import nötig, THREE liegt global bereit (r170).
        // -----------------------------------------------------------

        const canvas = document.getElementById('glcanvas');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
        renderer.setSize(400, 400, false);
        renderer.setPixelRatio(1);

        // Ortho-Kamera für Fullscreen-Quad (Shadertoy-Style)
        const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 100);
        cam.position.z = 1;

        const scene = new THREE.Scene();

        // -----------------------------------------------------------
        // Shader-Material: Hier passiert die Magie (Raymarching Loop)
        // -----------------------------------------------------------
        const material = new THREE.ShaderMaterial({
            uniforms: {
                u_time: { value: 0 },
                u_resolution: { value: new THREE.Vector2(400, 400) },
                u_mouse: { value: new THREE.Vector2(0.5, 0.5) },
                // Kamera-Parameter für Ray-Generierung im Vertex/Fragment
                u_camPos: { value: new THREE.Vector3(0, 3, 25) },
                u_camTarget: { value: new THREE.Vector3(0, 0.5, 0) },
                u_fov: { value: 45.0 },
            },
            vertexShader: /* glsl */`
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: /* glsl */`
                #define MAX_STEPS 100
                #define MAX_DIST 100.0
                #define SURF_DIST 0.001
                #define PI 3.14159265359
                #define TAU 6.28318530718
                
                precision highp float;
                
                uniform float u_time;
                uniform vec2 u_resolution;
                uniform vec2 u_mouse;
                uniform vec3 u_camPos;
                uniform vec3 u_camTarget;
                uniform float u_fov;
                
                varying vec2 vUv;
                
                // -----------------------------------------------------------
                // Fifo's Mathematik-Helferlein
                // -----------------------------------------------------------
                mat3 lookAt(vec3 ro, vec3 ta, vec3 up) {
                    vec3 f = normalize(ta - ro);
                    vec3 r = normalize(cross(up, f));
                    vec3 u = cross(f, r);
                    return mat3(r, u, f);
                }
                
                float sdSphere(vec3 p, float r) { return length(p) - r; }
                float sdBox(vec3 p, vec3 b) { vec3 q = abs(p) - b; return length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0); }
                float sdTorus(vec3 p, vec2 t) { vec2 q = vec2(length(p.xz) - t.x, p.y); return length(q) - t.y; }
                float sdPlane(vec3 p, vec3 n, float h) { return dot(p, n) + h; }
                float sdCylinder(vec3 p, vec2 h) { vec2 d = vec2(length(p.xz) - h.x, abs(p.y) - h.y); return min(max(d.x, d.y), 0.0) + length(max(d, 0.0)); }
                
                float opSmoothUnion(float d1, float d2, float k) {
                    float h = clamp(0.5 + 0.5 * (d2 - d1) / k, 0.0, 1.0);
                    return mix(d2, d1, h) - k * h * (1.0 - h);
                }
                
                // -----------------------------------------------------------
                // Szene definieren (SDF)
                // -----------------------------------------------------------
                float map(vec3 p, out int objId) {
                    objId = -1;
                    float d = 1e9;
                    int id = -1;
                    
                    // 1. Boden
                    float dPlane = sdPlane(p, vec3(0,1,0), 1.5); 
                    d = dPlane; id = 0;
                    
                    // 2. Zentraler Twisting Box
                    vec3 pBox = p - vec3(0.0, 0.5, 0.0);
                    float twist = u_time * 0.3;
                    pBox.xz = mat2(cos(twist), -sin(twist), sin(twist), cos(twist)) * pBox.xz;
                    float dBox = sdBox(pBox, vec3(0.8, 0.8, 0.8));
                    if (dBox < d) { d = dBox; id = 1; }
                    
                    // 3. Schwebende Kugel (Pulsierend)
                    vec3 pSph = p - vec3(-2.5, 1.5 + sin(u_time*1.2)*0.5, -1.0);
                    float dSph = sdSphere(pSph, 0.6 + 0.2*sin(u_time*2.0));
                    if (dSph < d) { d = dSph; id = 2; }
                    
                    // 4. Torus (Rotierend)
                    vec3 pTor = p - vec3(2.5, 1.0, 1.5);
                    float torAngle = u_time * 0.5;
                    pTor.xz = mat2(cos(torAngle), -sin(torAngle), sin(torAngle), cos(torAngle)) * pTor.xz;
                    pTor.xy = mat2(cos(torAngle*0.7), -sin(torAngle*0.7), sin(torAngle*0.7), cos(torAngle*0.7)) * pTor.xy;
                    float dTor = sdTorus(pTor, vec2(0.6, 0.25));
                    if (dTor < d) { d = dTor; id = 3; }
                    
                    // 5. Zylinder
                    vec3 pCyl = p - vec3(-2.0, 0.8, 2.5);
                    float dCyl = sdCylinder(pCyl, vec2(0.4, 1.2));
                    if (dCyl < d) { d = dCyl; id = 4; }
                    
                    // 6. Kleine Kugel rechts
                    vec3 pSph2 = p - vec3(1.8, 0.4, -2.0);
                    float dSph2 = sdSphere(pSph2, 0.4);
                    if (dSph2 < d) { d = dSph2; id = 5; }
                    
                    objId = id;
                    return d;
                }
                
                // -----------------------------------------------------------
                // Normalen berechnen
                // -----------------------------------------------------------
                vec3 calcNormal(vec3 p) {
                    vec2 e = vec2(0.001, 0.0);
                    return normalize(vec3(
                        map(p + e.xyy, int(0)) - map(p - e.xyy, int(0)),
                        map(p + e.yxy, int(0)) - map(p - e.yxy, int(0)),
                        map(p + e.yyx, int(0)) - map(p - e.yyx, int(0))
                    ));
                }
                
                // -----------------------------------------------------------
                // Weiche Schatten
                // -----------------------------------------------------------
                float softShadow(vec3 ro, vec3 rd, float mint, float maxt, float k) {
                    float res = 1.0;
                    float t = mint;
                    for(int i=0; i<32; i++) {
                        float h = map(ro + rd * t, int(0));
                        if(h < 0.001) return 0.0;
                        res = min(res, k * h / t);
                        t += h;
                        if(t >= maxt) break;
                    }
                    return clamp(res, 0.0, 1.0);
                }
                
                // -----------------------------------------------------------
                // Ambient Occlusion
                // -----------------------------------------------------------
                float calcAO(vec3 p, vec3 n) {
                    float ao = 0.0;
                    float sca = 1.0;
                    for(int i=0; i<5; i++) {
                        float hr = 0.01 + 0.12 * float(i) / 4.0;
                        float dd = map(p + n * hr, int(0));
                        ao += (hr - dd) * sca;
                        sca *= 0.5;
                    }
                    return 1.0 - clamp(ao, 0.0, 1.0);
                }
                
                // -----------------------------------------------------------
                // Farbzuweisung pro Objekt
                // -----------------------------------------------------------
                vec3 getColor(int id, vec3 p, vec3 n, vec3 rd, float ao, float shadow) {
                    vec3 col = vec3(0.0);
                    vec3 lightDir = normalize(vec3(2.0, 4.0, 1.5));
                    vec3 viewDir = -rd;
                    
                    // Fresnel
                    float fresnel = pow(1.0 - max(dot(n, viewDir), 0.0), 3.0);
                    
                    // Diffuse
                    float diff = max(dot(n, lightDir), 0.0);
                    
                    // Specular
                    vec3 halfDir = normalize(lightDir + viewDir);
                    float spec = pow(max(dot(n, halfDir), 0.0), 64.0);
                    
                    if(id == 0) { // Boden - heller, warmer Ton
                        vec3 base = vec3(0.55, 0.52, 0.48);
                        float checker = mod(floor(p.x*2.0) + floor(p.z*2.0), 2.0);
                        base = mix(base, base * 0.85, checker);
                        col = base * (0.5 + 0.5 * diff) * shadow * ao;
                        col += vec3(0.2, 0.18, 0.16) * fresnel;
                    }
                    else if(id == 1) { // Twisting Box - kräftiges Cyan
                        vec3 base = vec3(0.2, 0.9, 1.0);
                        col = base * (0.4 + 0.6 * diff) * shadow * ao;
                        col += vec3(0.9, 1.0, 1.0) * spec * shadow;
                        col += vec3(0.1, 0.4, 0.45) * fresnel;
                    }
                    else if(id == 2) { // Pulsierende Kugel - warmes Orange/Gold
                        vec3 base = vec3(1.0, 0.7, 0.2);
                        col = base * (0.45 + 0.55 * diff) * shadow * ao;
                        col += vec3(1.0, 0.95, 0.7) * spec * shadow;
                        col += vec3(0.5, 0.3, 0.1) * fresnel;
                    }
                    else if(id == 3) { // Torus - kräftiges Magenta
                        vec3 base = vec3(1.0, 0.3, 0.8);
                        col = base * (0.4 + 0.6 * diff) * shadow * ao;
                        col += vec3(1.0, 0.8, 1.0) * spec * shadow;
                        col += vec3(0.45, 0.1, 0.35) * fresnel;
                    }
                    else if(id == 4) { // Zylinder - leuchtendes Grün
                        vec3 base = vec3(0.3, 1.0, 0.45);
                        col = base * (0.45 + 0.55 * diff) * shadow * ao;
                        col += vec3(0.9, 1.0, 0.9) * spec * shadow;
                        col += vec3(0.1, 0.45, 0.15) * fresnel;
                    }
                    else if(id == 5) { // Kleine Kugel - helles Blau
                        vec3 base = vec3(0.4, 0.7, 1.0);
                        col = base * (0.5 + 0.5 * diff) * shadow * ao;
                        col += vec3(0.9, 0.95, 1.0) * spec * shadow;
                        col += vec3(0.15, 0.25, 0.5) * fresnel;
                    }
                    return col;
                }
                
                // -----------------------------------------------------------
                // Haupt-Rendering
                // -----------------------------------------------------------
                void mainImage(out vec4 fragColor, in vec2 fragCoord) {
                    vec2 uv = (fragCoord - 0.5 * u_resolution) / u_resolution.y;
                    
                    // Kamera aus Uniforms
                    vec3 ro = u_camPos;
                    vec3 ta = u_camTarget;
                    mat3 ca = lookAt(ro, ta, vec3(0,1,0));
                    
                    // Ray Direction
                    float fov = radians(u_fov);
                    vec3 rd = ca * normalize(vec3(uv * tan(fov * 0.5), -1.0));
                    
                    // Raymarching
                    float t = 0.0;
                    int objId = -1;
                    for(int i=0; i<MAX_STEPS; i++) {
                        vec3 p = ro + rd * t;
                        float d = map(p, objId);
                        if(d < SURF_DIST) break;
                        t += d;
                        if(t >= MAX_DIST) break;
                    }
                    
                    // Hintergrund - heller, freundlicher
                    vec3 bgCol = vec3(0.4, 0.45, 0.55);
                    bgCol += vec3(0.2, 0.18, 0.15) * smoothstep(-0.5, 0.5, rd.y); // Horizont
                    bgCol += vec3(0.15, 0.2, 0.3) * pow(max(-rd.y, 0.0), 2.0); // Zenit
                    
                    vec3 col = bgCol;
                    
                    if(t < MAX_DIST) {
                        vec3 p = ro + rd * t;
                        vec3 n = calcNormal(p);
                        
                        // Schatten
                        float shadow = softShadow(p + n * 0.01, normalize(vec3(2.0, 4.0, 1.5)), 0.01, 20.0, 32.0);
                        
                        // AO
                        float ao = calcAO(p, n);
                        
                        // Objekt-Farbe
                        col = getColor(objId, p, n, rd, ao, shadow);
                        
                        // Nebel - sehr subtil
                        float fog = exp(-t * 0.015);
                        col = mix(bgCol, col, fog);
                    }
                    
                    // Gamma & Tone Mapping - sanfter
                    col = pow(col, vec3(0.55));
                    col = col / (1.0 + col);
                    
                    // Vignette - sehr dezent
                    float vignette = 1.0 - 0.08 * length(uv);
                    col *= vignette;
                    
                    fragColor = vec4(col, 1.0);
                }
                
                void main() {
                    mainImage(gl_FragColor, vUv * u_resolution);
                }
            `,
        });

        const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
        scene.add(quad);

        // -----------------------------------------------------------
        // Input-Handling: Maus dreht, Rad zoomt, Tasten strafen
        // -----------------------------------------------------------
        let camPos = new THREE.Vector3(0, 3, 25);
        let camTarget = new THREE.Vector3(0, 0.5, 0);
        let yaw = 0, pitch = 0.2;
        const radius = 25;
        let isMouseDown = false;
        let lastMouse = { x: 0, y: 0 };

        canvas.addEventListener('mousedown', (e) => {
            isMouseDown = true;
            lastMouse = { x: e.clientX, y: e.clientY };
            canvas.style.cursor = 'grabbing';
        });
        window.addEventListener('mouseup', () => {
            isMouseDown = false;
            canvas.style.cursor = 'grab';
        });
        window.addEventListener('mousemove', (e) => {
            if (!isMouseDown) return;
            const dx = e.clientX - lastMouse.x;
            const dy = e.clientY - lastMouse.y;
            yaw -= dx * 0.005;
            pitch = THREE.MathUtils.clamp(pitch - dy * 0.005, -1.4, 1.4);
            lastMouse = { x: e.clientX, y: e.clientY };
            updateCamera();
        });
        window.addEventListener('wheel', (e) => {
            e.preventDefault();
            material.uniforms.u_fov.value = THREE.MathUtils.clamp(material.uniforms.u_fov.value + e.deltaY * 0.05, 20, 80);
        }, { passive: false });

        const keys = {};
        window.addEventListener('keydown', (e) => keys[e.code] = true);
        window.addEventListener('keyup', (e) => keys[e.code] = false);

        function updateCamera() {
            camPos.x = camTarget.x + radius * Math.cos(pitch) * Math.sin(yaw);
            camPos.y = camTarget.y + radius * Math.sin(pitch);
            camPos.z = camTarget.z + radius * Math.cos(pitch) * Math.cos(yaw);
            material.uniforms.u_camPos.value.copy(camPos);
        }

        function handleKeyboard() {
            const speed = 0.15;
            const forward = new THREE.Vector3().subVectors(camTarget, camPos).normalize();
            forward.y = 0; forward.normalize();
            const right = new THREE.Vector3().crossVectors(forward, new THREE.Vector3(0,1,0)).normalize();
            
            if (keys['KeyW'] || keys['ArrowUp']) { camTarget.addScaledVector(forward, speed); camPos.addScaledVector(forward, speed); }
            if (keys['KeyS'] || keys['ArrowDown']) { camTarget.addScaledVector(forward, -speed); camPos.addScaledVector(forward, -speed); }
            if (keys['KeyA'] || keys['ArrowLeft']) { camTarget.addScaledVector(right, -speed); camPos.addScaledVector(right, -speed); }
            if (keys['KeyD'] || keys['ArrowRight']) { camTarget.addScaledVector(right, speed); camPos.addScaledVector(right, speed); }
            if (keys['Space']) { camTarget.y += speed; camPos.y += speed; }
            if (keys['ShiftLeft'] || keys['ShiftRight']) { camTarget.y -= speed; camPos.y -= speed; }
            
            material.uniforms.u_camPos.value.copy(camPos);
            material.uniforms.u_camTarget.value.copy(camTarget);
        }

        // -----------------------------------------------------------
        // Render-Loop
        // -----------------------------------------------------------
        let startTime = performance.now();
        function animate() {
            requestAnimationFrame(animate);
            handleKeyboard();
            material.uniforms.u_time.value = (performance.now() - startTime) * 0.001;
            renderer.render(scene, cam);
        }
        animate();
        
        // Initial Kamera setzen
        updateCamera();
    </script>
</body>
</html>
