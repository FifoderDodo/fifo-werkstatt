<!DOCTYPE html>
<html lang="de">
<head><script type="module">import * as T from "https://unpkg.com/three@0.170.0/build/three.module.js"; window.THREE = T;</script>
  <meta charset="UTF-8">
  <title>Der nutzlose Schuppen – Teil 20</title>
  <style>
    body { margin: 0; background: #4a6a8a; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: monospace; }
    canvas { border: 2px solid #e94560; border-radius: 4px; box-shadow: 0 0 20px rgba(233, 69, 96, 0.3); }
    #info { position: fixed; bottom: 10px; left: 10px; color: #e94560; font-size: 11px; opacity: 0.8; }
  </style>
</head>
<body>
  <div id="info">Fifo der Dodo bastelt: Der nutzlose Schuppen – Teil 20</div>
  <script type="module">
    // Fifo der Dodo hier. Teil 20: Code vervollständigt, Schild schwingt im Wind, Maussteuerung läuft, alles rund.

    const canvas = document.createElement('canvas');
    canvas.width = 400;
    canvas.height = 400;
    document.body.appendChild(canvas);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(400, 400);
    renderer.setClearColor(0x4a6a8a);

    const scene = new THREE.Scene();

    // Kamera – weiter weg, damit alles drauf passt
    const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
    camera.position.set(10, 6, 10);
    camera.lookAt(0, 1.5, 0);

    // Licht – mehr Power, damit die Kanten knallen
    const ambient = new THREE.AmbientLight(0xffffff, 1.2);
    scene.add(ambient);

    const dirLight = new THREE.DirectionalLight(0xfff5e6, 2.5);
    dirLight.position.set(8, 12, 5);
    scene.add(dirLight);

    const fillLight = new THREE.DirectionalLight(0x4ecdc4, 1.5);
    fillLight.position.set(-6, 5, -8);
    scene.add(fillLight);

    const backLight = new THREE.DirectionalLight(0xffebcc, 1.0);
    backLight.position.set(0, 10, -10);
    scene.add(backLight);

    // Materialien – kräftiger, unpassender, hässlicher
    const matHolz = new THREE.MeshStandardMaterial({ color: 0xc4703c, roughness: 0.8, metalness: 0.1 });
    const matRost = new THREE.MeshStandardMaterial({ color: 0xe87d2a, roughness: 0.7, metalness: 0.3 });
    const matSchimmel = new THREE.MeshStandardMaterial({ color: 0x8fbc4a, roughness: 0.9, metalness: 0 });
    const matDach = new THREE.MeshStandardMaterial({ color: 0x5a2e1a, roughness: 0.6, metalness: 0.2 });
    const matTuer = new THREE.MeshStandardMaterial({ color: 0x7b3d1a, roughness: 0.8, metalness: 0.15 });
    const matRohr = new THREE.MeshStandardMaterial({ color: 0x999999, roughness: 0.5, metalness: 0.8 });
    const matGlas = new THREE.MeshStandardMaterial({ color: 0x4ecdc4, roughness: 0.1, metalness: 0.8, transparent: true, opacity: 0.7 });
    const matBrett = new THREE.MeshStandardMaterial({ color: 0xa8842a, roughness: 1 });
    const matFass = new THREE.MeshStandardMaterial({ color: 0xa0522d, roughness: 0.8, metalness: 0.1 });
    const matReifen = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.8, metalness: 0.2 });
    const matPlatte = new THREE.MeshStandardMaterial({ color: 0x7a6a4a, roughness: 0.7, metalness: 0.1 });
    const matBoden = new THREE.MeshStandardMaterial({ color: 0x5a5a3a, roughness: 1 });
    const matGras = new THREE.MeshStandardMaterial({ color: 0x4ade80, roughness: 1 });
    const matSchild = new THREE.MeshStandardMaterial({ color: 0xffeb3b, roughness: 0.6, metalness: 0.3, side: THREE.DoubleSide });

    // QUADER 1 – Hauptteil, steht krumm
    const box1 = new THREE.Mesh(
      new THREE.BoxGeometry(3, 2.5, 2),
      matHolz
    );
    box1.position.set(0, 1.25, 0);
    box1.rotation.y = 0.08;
    box1.rotation.x = -0.03;
    box1.rotation.z = 0.02;
    scene.add(box1);

    // FENSTER für box1 – Kind, damit es mit rotiert
    const fenster1 = new THREE.Mesh(
      new THREE.PlaneGeometry(0.8, 0.6),
      matGlas
    );
    fenster1.position.set(0, 0.2, 1.01);
    fenster1.rotation.y = Math.PI;
    box1.add(fenster1);

    // QUADER 2 – Anbau, kleiner, noch schiefer
    const box2 = new THREE.Mesh(
      new THREE.BoxGeometry(1.5, 1.8, 1.5),
      matRost
    );
    box2.position.set(-2.1, 0.9, 0.5);
    box2.rotation.y = -0.12;
    box2.rotation.x = 0.05;
    box2.rotation.z = -0.04;
    scene.add(box2);

    // FENSTER für box2 – seitlich, auch Kind
    const fenster2 = new THREE.Mesh(
      new THREE.PlaneGeometry(0.5, 0.5),
      matGlas
    );
    fenster2.position.set(0.76, 0.1, 0);
    fenster2.rotation.y = -Math.PI / 2;
    box2.add(fenster2);

    // QUADER 3 – Vordach / Vorbau, hängt nur so rum
    const box3 = new THREE.Mesh(
      new THREE.BoxGeometry(2.2, 0.4, 1.8),
      matSchimmel
    );
    box3.position.set(0.3, 2.6, 0.1);
    box3.rotation.y = 0.05;
    box3.rotation.x = -0.08;
    box3.rotation.z = 0.03;
    scene.add(box3);

    // KAPUTTER KEGEL als Dach – oben offen, schief, unrund
    const dach = new THREE.Mesh(
      new THREE.ConeGeometry(2.2, 1.5, 5, 1, true),
      matDach
    );
    dach.position.set(0.15, 3.55, -0.1);
    dach.rotation.y = 0.15;
    dach.rotation.x = -0.1;
    dach.rotation.z = 0.07;
    dach.scale.set(1, 0.7, 1.2);
    scene.add(dach);

    // TÜR – schief, klemmt, passt nicht
    const tuer = new THREE.Mesh(
      new THREE.BoxGeometry(1.1, 1.6, 0.08),
      matTuer
    );
    tuer.position.set(0.05, 0.8, 1.06);
    tuer.rotation.y = 0.08;
    tuer.rotation.x = -0.03;
    tuer.rotation.z = 0.04;
    scene.add(tuer);

    // SCHORNSTEINROHR – ragt schief ausm Dach, qualmt nicht mal mehr
    const rohr = new THREE.Mesh(
      new THREE.CylinderGeometry(0.18, 0.18, 1.2, 6),
      matRohr
    );
    rohr.position.set(1.1, 4.2, -0.5);
    rohr.rotation.x = 0.25;
    rohr.rotation.z = -0.15;
    scene.add(rohr);

    // Ein paar Bretter als Deko – damit es nach Gerümpel aussieht
    const brettGeo = new THREE.BoxGeometry(1.2, 0.08, 0.3);

    const brett1 = new THREE.Mesh(brettGeo, matBrett);
    brett1.position.set(-1.5, 0.3, 1.2);
    brett1.rotation.z = 0.3;
    brett1.rotation.y = 0.2;
    scene.add(brett1);

    const brett2 = new THREE.Mesh(brettGeo, matBrett);
    brett2.position.set(1.2, 0.4, -1.1);
    brett2.rotation.z = -0.2;
    brett2.rotation.y = -0.15;
    scene.add(brett2);

    const brett3 = new THREE.Mesh(brettGeo, matBrett);
    brett3.position.set(-0.5, 0.2, -1.3);
    brett3.rotation.z = 0.1;
    brett3.rotation.y = 0.4;
    scene.add(brett3);

    // FASS – rostig, steht schief rum
    const fass = new THREE.Mesh(
      new THREE.CylinderGeometry(0.5, 0.5, 0.8, 8),
      matFass
    );
    fass.position.set(-2.5, 0.4, -0.8);
    fass.rotation.z = 0.15;
    scene.add(fass);

    // REIFEN – platt, liegt nur rum
    const reifen = new THREE.Mesh(
      new THREE.TorusGeometry(0.4, 0.12, 6, 12),
      matReifen
    );
    reifen.position.set(2.2, 0.12, 0.5);
    reifen.rotation.x = Math.PI / 2;
    reifen.rotation.z = 0.3;
    scene.add(reifen);

    // PLATTEN – wellblechartig, lehnen an der Wand
    const platteGeo = new THREE.BoxGeometry(1.5, 0.05, 1.0);
    const platte1 = new THREE.Mesh(platteGeo, matPlatte);
    platte1.position.set(-1.0, 0.5, 1.5);
    platte1.rotation.y = 0.1;
    platte1.rotation.x = -0.2;
    scene.add(platte1);

    const platte2 = new THREE.Mesh(platteGeo, matPlatte);
    platte2.position.set(1.5, 0.6, -1.5);
    platte2.rotation.y = -0.2;
    platte2.rotation.x = 0.15;
    scene.add(platte2);

    // BODEN – uneben, dreckig
    const boden = new THREE.Mesh(
      new THREE.PlaneGeometry(20, 20),
      matBoden
    );
    boden.rotation.x = -Math.PI / 2;
    boden.position.y = 0;
    scene.add(boden);

    // GRAS – ein paar Halme, wild gewachsen
    for (let i = 0; i < 30; i++) {
      const halm = new THREE.Mesh(
        new THREE.ConeGeometry(0.02, 0.15, 3),
        matGras
      );
      halm.position.set(
        (Math.random() - 0.5) * 18,
        0.075,
        (Math.random() - 0.5) * 18
      );
      halm.rotation.y = Math.random() * Math.PI * 2;
      halm.rotation.x = (Math.random() - 0.5) * 0.3;
      scene.add(halm);
    }

    // SCHILD – "Betreten verboten" oder so, schwingt im Wind
    const schildGruppe = new THREE.Group();
    const schildPlatte = new THREE.Mesh(
      new THREE.PlaneGeometry(0.8, 0.5),
      matSchild
    );
    schildPlatte.position.y = 0.25;
    schildGruppe.add(schildPlatte);

    const schildStab = new THREE.Mesh(
      new THREE.CylinderGeometry(0.03, 0.03, 1.5, 4),
      matRohr
    );
    schildStab.position.y = -0.5;
    schildGruppe.add(schildStab);

    schildGruppe.position.set(1.8, 0, 1.6);
    schildGruppe.rotation.y = -0.3;
    scene.add(schildGruppe);

    // MAUSSTEUERUNG – ziehen zum Drehen, Rad zum Zoomen
    let isDragging = false;
    let lastMouseX = 0;
    let lastMouseY = 0;
    const target = new THREE.Vector3(0, 1.5, 0);
    const spherical = new THREE.Spherical();
    spherical.setFromVector3(camera.position.clone().sub(target));

    canvas.addEventListener('mousedown', (e) => {
      isDragging = true;
      lastMouseX = e.clientX;
      lastMouseY = e.clientY;
      canvas.style.cursor = 'grabbing';
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const deltaX = e.clientX - lastMouseX;
      const deltaY = e.clientY - lastMouseY;
      spherical.theta -= deltaX * 0.005;
      spherical.phi += deltaY * 0.005;
      spherical.phi = Math.max(0.1, Math.min(Math.PI - 0.1, spherical.phi));
      lastMouseX = e.clientX;
      lastMouseY = e.clientY;
    });

    window.addEventListener('mouseup', () => {
      isDragging = false;
      canvas.style.cursor = 'grab';
    });

    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      spherical.radius *= e.deltaY > 0 ? 1.1 : 0.9;
      spherical.radius = Math.max(3, Math.min(25, spherical.radius));
    }, { passive: false });

    // TASTEN – Pfeile drehen/neigen, Leertaste resettet
    window.addEventListener('keydown', (e) => {
      switch (e.code) {
        case 'ArrowLeft': spherical.theta -= 0.05; break;
        case 'ArrowRight': spherical.theta += 0.05; break;
        case 'ArrowUp': spherical.phi = Math.max(0.1, spherical.phi - 0.05); break;
        case 'ArrowDown': spherical.phi = Math.min(Math.PI - 0.1, spherical.phi + 0.05); break;
        case 'Space':
          spherical.set(12, Math.PI / 3, Math.PI / 4);
          target.set(0, 1.5, 0);
          break;
      }
    });

    // ANIMATIONSLOOP – alles bewegt sich leicht
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      // Kamera aus Spherical aktualisieren
      camera.position.setFromSpherical(spherical).add(target);
      camera.lookAt(target);

      // Schild schwingt im Wind – Sinus auf Z und X
      schildGruppe.rotation.z = Math.sin(t * 1.2) * 0.15;
      schildGruppe.rotation.x = Math.cos(t * 0.9) * 0.05;

      // Dach wackelt ganz leicht
      dach.rotation.y = 0.15 + Math.sin(t * 0.7) * 0.01;
      dach.rotation.x = -0.1 + Math.cos(t * 0.5) * 0.005;

      // Rohr vibriert minimal
      rohr.rotation.x = 0.25 + Math.sin(t * 2.3) * 0.008;

      // Bretter flattern ganz wenig
      brett1.rotation.z = 0.3 + Math.sin(t * 1.1) * 0.02;
      brett2.rotation.z = -0.2 + Math.cos(t * 0.8) * 0.015;
      brett3.rotation.z = 0.1 + Math.sin(t * 1.5) * 0.01;

      renderer.render(scene, camera);
    }
    animate();

    // Init Cursor
    canvas.style.cursor = 'grab';
  </script>
</body>
</html>
