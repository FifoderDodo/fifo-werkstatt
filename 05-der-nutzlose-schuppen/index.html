<!DOCTYPE html>
<html lang="de">
<head><script type="module">import * as T from "https://unpkg.com/three@0.170.0/build/three.module.js"; window.THREE = T;</script>
  <meta charset="UTF-8">
  <title>Der nutzlose Schuppen – Teil 2</title>
  <style>
    body { margin: 0; background: #1a1a2e; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: monospace; }
    canvas { border: 2px solid #e94560; border-radius: 4px; box-shadow: 0 0 20px rgba(233, 69, 96, 0.3); }
    #info { position: fixed; bottom: 10px; left: 10px; color: #e94560; font-size: 11px; opacity: 0.8; }
  </style>
</head>
<body>
  <div id="info">Fifo der Dodo bastelt: Der nutzlose Schuppen – Teil 2</div>
  <script type="module">
    // Fifo der Dodo hier. Noch immer wach. Noch immer genervt. Der Schuppen wächst.

    const canvas = document.createElement('canvas');
    canvas.width = 400;
    canvas.height = 400;
    document.body.appendChild(canvas);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(400, 400);
    renderer.setClearColor(0x0f0f23);

    const scene = new THREE.Scene();

    // Kamera – leicht schräg, damit man die Schieflage sieht
    const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
    camera.position.set(6, 4, 6);
    camera.lookAt(0, 1.5, 0);

    // Licht – zwei Stück, damit die Kanten knallen
    const ambient = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambient);

    const dirLight = new THREE.DirectionalLight(0xfff5e6, 1);
    dirLight.position.set(5, 8, 3);
    scene.add(dirLight);

    const fillLight = new THREE.DirectionalLight(0x4ecdc4, 0.5);
    fillLight.position.set(-4, 3, -5);
    scene.add(fillLight);

    // Materialien – kräftig, unpassend, hässlich
    const matHolz = new THREE.MeshStandardMaterial({ color: 0x8b5a2b, roughness: 0.9, metalness: 0.1 });
    const matRost = new THREE.MeshStandardMaterial({ color: 0xb84b1e, roughness: 0.8, metalness: 0.3 });
    const matSchimmel = new THREE.MeshStandardMaterial({ color: 0x4a7c2e, roughness: 0.95, metalness: 0 });
    const matDach = new THREE.MeshStandardMaterial({ color: 0x2c1810, roughness: 0.7, metalness: 0.2 });
    const matTuer = new THREE.MeshStandardMaterial({ color: 0x3d2314, roughness: 0.85, metalness: 0.15 });
    const matRohr = new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 0.6, metalness: 0.8 });

    // QUADER 1 – Hauptteil, steht krumm
    const box1 = new THREE.Mesh(
      new THREE.BoxGeometry(3, 2.5, 2),
      matHolz
    );
    box1.position.set(0, 1.25, 0);
    box1.rotation.y = 0.08;
    box1.rotation.x = -0.03;
    box1.rotation.z = 0.02;
    scene.add(box1);

    // QUADER 2 – Anbau, kleiner, noch schiefer
    const box2 = new THREE.Mesh(
      new THREE.BoxGeometry(1.5, 1.8, 1.5),
      matRost
    );
    box2.position.set(-2.1, 0.9, 0.5);
    box2.rotation.y = -0.12;
    box2.rotation.x = 0.05;
    box2.rotation.z = -0.04;
    scene.add(box2);

    // QUADER 3 – Vordach / Vorbau, hängt nur so rum
    const box3 = new THREE.Mesh(
      new THREE.BoxGeometry(2.2, 0.4, 1.8),
      matSchimmel
    );
    box3.position.set(0.3, 2.6, 0.1);
    box3.rotation.y = 0.05;
    box3.rotation.x = -0.08;
    box3.rotation.z = 0.03;
    scene.add(box3);

    // KAPUTTER KEGEL als Dach – oben offen, schief, unrund
    const dach = new THREE.Mesh(
      new THREE.ConeGeometry(2.2, 1.5, 5, 1, true),
      matDach
    );
    dach.position.set(0.15, 3.55, -0.1);
    dach.rotation.y = 0.15;
    dach.rotation.x = -0.1;
    dach.rotation.z = 0.07;
    dach.scale.set(1, 0.7, 1.2);
    scene.add(dach);

    // TÜR – schief, klemmt, passt nicht
    const tuer = new THREE.Mesh(
      new THREE.BoxGeometry(1.1, 1.6, 0.08),
      matTuer
    );
    tuer.position.set(0.05, 0.8, 1.06);
    tuer.rotation.y = 0.08;
    tuer.rotation.x = -0.03;
    tuer.rotation.z = 0.04;
    scene.add(tuer);

    // SCHORNSTEINROHR – ragt schief ausm Dach, qualmt nicht mal mehr
    const rohr = new THREE.Mesh(
      new THREE.CylinderGeometry(0.18, 0.18, 1.2, 6),
      matRohr
    );
    rohr.position.set(1.1, 4.2, -0.5);
    rohr.rotation.x = 0.25;
    rohr.rotation.z = -0.15;
    scene.add(rohr);

    // Ein paar Bretter als Deko – damit es nach Gerümpel aussieht
    const brettGeo = new THREE.BoxGeometry(1.2, 0.08, 0.3);
    const brettMat = new THREE.MeshStandardMaterial({ color: 0x5d4037, roughness: 1 });

    const brett1 = new THREE.Mesh(brettGeo, brettMat);
    brett1.position.set(-1.5, 0.3, 1.2);
    brett1.rotation.z = 0.3;
    brett1.rotation.y = 0.2;
    scene.add(brett1);

    const brett2 = new THREE.Mesh(brettGeo, brettMat);
    brett2.position.set(1.3, 0.4, -1.1);
    brett2.rotation.z = -0.2;
    brett2.rotation.y = -0.15;
    scene.add(brett2);

    const brett3 = new THREE.Mesh(brettGeo, brettMat);
    brett3.position.set(-2.5, 1.5, -0.5);
    brett3.rotation.x = 0.4;
    brett3.rotation.y = 0.5;
    scene.add(brett3);

    // Animation – ganz leichtes Wackeln, weil der Schuppen nicht mehr kann
    let time = 0;
    function animate() {
      requestAnimationFrame(animate);
      time += 0.01;
      box1.rotation.y = 0.08 + Math.sin(time * 0.7) * 0.003;
      box2.rotation.y = -0.12 + Math.cos(time * 0.5) * 0.004;
      dach.rotation.y = 0.15 + Math.sin(time * 0.3) * 0.002;
      tuer.rotation.y = 0.08 + Math.sin(time * 0.9) * 0.002;
      rohr.rotation.y = Math.sin(time * 0.4) * 0.003;
      renderer.render(scene, camera);
    }
    animate();

    // Resize? Nee. 400x400 fest. Fertig.
  </script>
</body>
</html>
