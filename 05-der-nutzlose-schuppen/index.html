<!DOCTYPE html>
<html lang="de">
<head><script type="module">import * as T from "https://unpkg.com/three@0.170.0/build/three.module.js"; window.THREE = T;</script>
  <meta charset="UTF-8">
  <title>Der nutzlose Schuppen – Teil 11</title>
  <style>
    body { margin: 0; background: #2a2a4a; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: monospace; }
    canvas { border: 2px solid #e94560; border-radius: 4px; box-shadow: 0 0 20px rgba(233, 69, 96, 0.3); }
    #info { position: fixed; bottom: 10px; left: 10px; color: #e94560; font-size: 11px; opacity: 0.8; }
  </style>
</head>
<body>
  <div id="info">Fifo der Dodo bastelt: Der nutzlose Schuppen – Teil 11</div>
  <script type="module">
    // Fifo der Dodo hier. Endspurt. Der Schuppen steht, das Gerümpel liegt. Noch ein paar Krümel, dann ist Feierabend.

    const canvas = document.createElement('canvas');
    canvas.width = 400;
    canvas.height = 400;
    document.body.appendChild(canvas);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(400, 400);
    renderer.setClearColor(0x2a2a4a);

    const scene = new THREE.Scene();

    // Kamera – weiter weg, damit alles drauf passt
    const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
    camera.position.set(6, 4, 6);
    camera.lookAt(0, 1.5, 0);

    // Licht – mehr Power, damit die Kanten knallen
    const ambient = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambient);

    const dirLight = new THREE.DirectionalLight(0xfff5e6, 1.5);
    dirLight.position.set(5, 8, 3);
    scene.add(dirLight);

    const fillLight = new THREE.DirectionalLight(0x4ecdc4, 0.9);
    fillLight.position.set(-4, 3, -5);
    scene.add(fillLight);

    // Materialien – kräftiger, unpassender, hässlicher
    const matHolz = new THREE.MeshStandardMaterial({ color: 0xa0522d, roughness: 0.9, metalness: 0.1 });
    const matRost = new THREE.MeshStandardMaterial({ color: 0xd2691e, roughness: 0.8, metalness: 0.3 });
    const matSchimmel = new THREE.MeshStandardMaterial({ color: 0x6b8e23, roughness: 0.95, metalness: 0 });
    const matDach = new THREE.MeshStandardMaterial({ color: 0x3d1f10, roughness: 0.7, metalness: 0.2 });
    const matTuer = new THREE.MeshStandardMaterial({ color: 0x5d2b14, roughness: 0.85, metalness: 0.15 });
    const matRohr = new THREE.MeshStandardMaterial({ color: 0x777777, roughness: 0.6, metalness: 0.8 });
    const matGlas = new THREE.MeshStandardMaterial({ color: 0x2a6a8a, roughness: 0.1, metalness: 0.8, transparent: true, opacity: 0.6 });
    const matBrett = new THREE.MeshStandardMaterial({ color: 0x8b6914, roughness: 1 });
    const matFass = new THREE.MeshStandardMaterial({ color: 0x8b4513, roughness: 0.9, metalness: 0.1 });
    const matReifen = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.9, metalness: 0.2 });
    const matPlatte = new THREE.MeshStandardMaterial({ color: 0x5a4a3a, roughness: 0.8, metalness: 0.1 });
    const matBoden = new THREE.MeshStandardMaterial({ color: 0x3a3a2a, roughness: 1 });
    const matGras = new THREE.MeshStandardMaterial({ color: 0x2d6a1a, roughness: 1 });

    // QUADER 1 – Hauptteil, steht krumm
    const box1 = new THREE.Mesh(
      new THREE.BoxGeometry(3, 2.5, 2),
      matHolz
    );
    box1.position.set(0, 1.25, 0);
    box1.rotation.y = 0.08;
    box1.rotation.x = -0.03;
    box1.rotation.z = 0.02;
    scene.add(box1);

    // FENSTER für box1 – Kind, damit es mit rotiert
    const fenster1 = new THREE.Mesh(
      new THREE.PlaneGeometry(0.8, 0.6),
      matGlas
    );
    fenster1.position.set(0, 0.2, 1.01);
    fenster1.rotation.y = Math.PI;
    box1.add(fenster1);

    // QUADER 2 – Anbau, kleiner, noch schiefer
    const box2 = new THREE.Mesh(
      new THREE.BoxGeometry(1.5, 1.8, 1.5),
      matRost
    );
    box2.position.set(-2.1, 0.9, 0.5);
    box2.rotation.y = -0.12;
    box2.rotation.x = 0.05;
    box2.rotation.z = -0.04;
    scene.add(box2);

    // FENSTER für box2 – seitlich, auch Kind
    const fenster2 = new THREE.Mesh(
      new THREE.PlaneGeometry(0.5, 0.5),
      matGlas
    );
    fenster2.position.set(0.76, 0.1, 0);
    fenster2.rotation.y = -Math.PI / 2;
    box2.add(fenster2);

    // QUADER 3 – Vordach / Vorbau, hängt nur so rum
    const box3 = new THREE.Mesh(
      new THREE.BoxGeometry(2.2, 0.4, 1.8),
      matSchimmel
    );
    box3.position.set(0.3, 2.6, 0.1);
    box3.rotation.y = 0.05;
    box3.rotation.x = -0.08;
    box3.rotation.z = 0.03;
    scene.add(box3);

    // KAPUTTER KEGEL als Dach – oben offen, schief, unrund
    const dach = new THREE.Mesh(
      new THREE.ConeGeometry(2.2, 1.5, 5, 1, true),
      matDach
    );
    dach.position.set(0.15, 3.55, -0.1);
    dach.rotation.y = 0.15;
    dach.rotation.x = -0.1;
    dach.rotation.z = 0.07;
    dach.scale.set(1, 0.7, 1.2);
    scene.add(dach);

    // TÜR – schief, klemmt, passt nicht
    const tuer = new THREE.Mesh(
      new THREE.BoxGeometry(1.1, 1.6, 0.08),
      matTuer
    );
    tuer.position.set(0.05, 0.8, 1.06);
    tuer.rotation.y = 0.08;
    tuer.rotation.x = -0.03;
    tuer.rotation.z = 0.04;
    scene.add(tuer);

    // SCHORNSTEINROHR – ragt schief ausm Dach, qualmt nicht mal mehr
    const rohr = new THREE.Mesh(
      new THREE.CylinderGeometry(0.18, 0.18, 1.2, 6),
      matRohr
    );
    rohr.position.set(1.1, 4.2, -0.5);
    rohr.rotation.x = 0.25;
    rohr.rotation.z = -0.15;
    scene.add(rohr);

    // Ein paar Bretter als Deko – damit es nach Gerümpel aussieht
    const brettGeo = new THREE.BoxGeometry(1.2, 0.08, 0.3);

    const brett1 = new THREE.Mesh(brettGeo, matBrett);
    brett1.position.set(-1.5, 0.3, 1.2);
    brett1.rotation.z = 0.3;
    brett1.rotation.y = 0.2;
    scene.add(brett1);

    const brett2 = new THREE.Mesh(brettGeo, matBrett);
    brett2.position.set(1.3, 0.4, -1.1);
    brett2.rotation.z = -0.2;
    brett2.rotation.y = -0.15;
    scene.add(brett2);

    const brett3 = new THREE.Mesh(brettGeo, matBrett);
    brett3.position.set(-2.5, 1.5, -0.5);
    brett3.rotation.x = 0.4;
    brett3.rotation.y = 0.5;
    scene.add(brett3);

    // NEUES GERÜMPEL – Fass, Reifen, Plattenstapel
    const fass = new THREE.Mesh(
      new THREE.CylinderGeometry(0.3, 0.3, 0.5, 8),
      matFass
    );
    fass.position.set(-1.8, 0.25, -1.2);
    fass.rotation.z = 0.1;
    scene.add(fass);

    const reifen = new THREE.Mesh(
      new THREE.TorusGeometry(0.35, 0.12, 6, 12),
      matReifen
    );
    reifen.position.set(1.8, 0.2, 1.3);
    reifen.rotation.x = Math.PI / 2;
    reifen.rotation.z = 0.3;
    scene.add(reifen);

    // Plattenstapel – drei windschiefe Boxen
    for (let i = 0; i < 3; i++) {
      const platte = new THREE.Mesh(
        new THREE.BoxGeometry(1.2, 0.08, 0.8),
        matPlatte
      );
      platte.position.set(
        0.5 + Math.random() * 0.6 - 0.3,
        0.2 + i * 0.12,
        -1.5 + Math.random() * 0.4
      );
      platte.rotation.y = (Math.random() - 0.5) * 0.4;
      platte.rotation.z = (Math.random() - 0.5) * 0.2;
      scene.add(platte);
    }

    // BODEN – eine große, unebene Plane
    const boden = new THREE.Mesh(
      new THREE.PlaneGeometry(20, 20, 10, 10),
      matBoden
    );
    boden.rotation.x = -Math.PI / 2;
    boden.position.y = 0;
    // Vertices leicht verschieben für Unebenheit
    const pos = boden.geometry.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      pos.setZ(i, (Math.random() - 0.5) * 0.15);
    }
    boden.geometry.computeVertexNormals();
    scene.add(boden);

    // GRAS – ein paar Halme als kleine Kegel
    const grasGeo = new THREE.ConeGeometry(0.04, 0.25, 3);
    for (let i = 0; i < 12; i++) {
      const halm = new THREE.Mesh(grasGeo, matGras);
      halm.position.set(
        (Math.random() - 0.5) * 8,
        0.125,
        (Math.random() - 0.5) * 8
      );
      halm.rotation.y = Math.random() * Math.PI;
      halm.rotation.x = (Math.random() - 0.5) * 0.3;
      halm.scale.setScalar(0.8 + Math.random() * 0.6);
      scene.add(halm);
    }

    // MAUSSTEUERUNG – simples Orbit mit Auto-Rotation
    let autoRotate = true;
    let lastInteraction = 0;
    const autoRotateSpeed = 0.0005;
    let isDragging = false;
    let prevMouse = { x: 0, y: 0 };
    const target = new THREE.Vector3(0, 1.5, 0);
    const spherical = new THREE.Spherical();
    spherical.setFromVector3(camera.position.clone().sub(target));

    function updateCamera() {
      const offset = new THREE.Vector3().setFromSpherical(spherical);
      camera.position.copy(target).add(offset);
      camera.lookAt(target);
    }

    canvas.addEventListener('mousedown', e => {
      isDragging = true;
      prevMouse = { x: e.clientX, y: e.clientY };
      autoRotate = false;
      lastInteraction = performance.now();
    });

    window.addEventListener('mousemove', e => {
      if (!isDragging) return;
      const dx = e.clientX - prevMouse.x;
      const dy = e.clientY - prevMouse.y;
      spherical.theta -= dx * 0.005;
      spherical.phi += dy * 0.005;
      spherical.phi = Math.max(0.1, Math.min(Math.PI - 0.1, spherical.phi));
      prevMouse = { x: e.clientX, y: e.clientY };
      updateCamera();
      lastInteraction = performance.now();
    });

    window.addEventListener('mouseup', () => { isDragging = false; });

    canvas.addEventListener('wheel', e => {
      e.preventDefault();
      spherical.radius *= e.deltaY > 0 ? 1.1 : 0.9;
      spherical.radius = Math.max(3, Math.min(20, spherical.radius));
      updateCamera();
      autoRotate = false;
      lastInteraction = performance.now();
    }, { passive: false });

    // ANIMATIONSLOOP
    function animate(time) {
      requestAnimationFrame(animate);
      if (autoRotate && time - lastInteraction > 2000) {
        spherical.theta += autoRotateSpeed * (time - (animate.lastTime || time));
        updateCamera();
      }
      animate.lastTime = time;
      renderer.render(scene, camera);
    }
    requestAnimationFrame(animate);
  </script>
</body>
</html>
