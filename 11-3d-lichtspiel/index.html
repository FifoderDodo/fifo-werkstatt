<!DOCTYPE html>
<html lang="de">
<head><script type="module">import * as T from "https://unpkg.com/three@0.170.0/build/three.module.js"; window.THREE = T;</script>
<meta charset="UTF-8">
<title>3D-Lichtspiel – Herbstpark Volumetrisch</title>
<style>
  body { margin:0; background:#3a2a1a; display:flex; justify-content:center; align-items:center; height:100vh; font-family:monospace; color:#f0e0c0; overflow:hidden; }
  canvas { display:block; border:2px solid #6a5a3a; box-shadow:0 0 30px rgba(255,200,100,0.4); background:#2a1a10; }
  #info { position:fixed; top:10px; left:10px; pointer-events:none; line-height:1.4; font-size:11px; text-shadow:0 0 3px #000; }
  #hud { position:fixed; bottom:10px; left:10px; right:10px; font-size:10px; opacity:0.8; text-align:center; color:#f0e0c0; }
</style>
</head>
<body>
<div id="info"></div>
<div id="hud">Pfeile: Kamera drehen | Leertaste: Hoch/Runter | Shift: Tempo | Herbstwind weht...</div>
<script type="module">
// ===== Fifo der Dodo bastelt: Volumetrischer Herbstpark (Raymarching mit Distanzfeld) =====
// Three.js r170 liegt global als THREE vor

const W = 400, H = 400;
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false });
renderer.setSize(W, H);
renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 2.5;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x3a2a1a, 0.008);

const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 200);
camera.position.set(0, 12, 28);

// --- Licht: Spotlight für Godrays ---
const spot = new THREE.SpotLight(0xffcc60, 3000, 50, Math.PI/4.5, 0.5, 1);
spot.position.set(5, 18, 10);
spot.target.position.set(0, 0, 0);
spot.castShadow = true;
spot.shadow.mapSize.set(1024, 1024);
spot.shadow.camera.near = 1;
spot.shadow.camera.far = 60;
spot.shadow.camera.fov = 55;
spot.shadow.bias = -0.0005;
spot.shadow.normalBias = 0.02;
scene.add(spot);
scene.add(spot.target);

// Zweites Spotlight für mehr Volumen
const spot2 = new THREE.SpotLight(0xffaa20, 1500, 40, Math.PI/5, 0.6, 1);
spot2.position.set(-8, 15, -5);
spot2.target.position.set(2, 0, -2);
spot2.castShadow = true;
spot2.shadow.mapSize.set(512, 512);
spot2.shadow.camera.near = 1;
spot2.shadow.camera.far = 50;
spot2.shadow.camera.fov = 50;
scene.add(spot2);
scene.add(spot2.target);

// Ambient heller
const amb = new THREE.AmbientLight(0x6a5a4a, 2.0);
scene.add(amb);

// Hemisphere für natürlicheres Licht
const hemi = new THREE.HemisphereLight(0xffeecc, 0x2a1a10, 1.5);
scene.add(hemi);

// --- Herbst-Materialien (kräftigere Farben) ---
const matGround = new THREE.MeshStandardMaterial({ color:0x4d3a2a, roughness:0.9, metalness:0.05 });
const matTrunk = new THREE.MeshStandardMaterial({ color:0x5a3a2a, roughness:0.85, metalness:0.1 });
const matLeaf = [
  new THREE.MeshStandardMaterial({ color:0xff8a4a, roughness:0.75, metalness:0.05, transparent:true, opacity:0.95 }),
  new THREE.MeshStandardMaterial({ color:0xffc04a, roughness:0.75, metalness:0.05, transparent:true, opacity:0.95 }),
  new THREE.MeshStandardMaterial({ color:0xff9a4a, roughness:0.75, metalness:0.05, transparent:true, opacity:0.95 }),
  new THREE.MeshStandardMaterial({ color:0xaa7a4a, roughness:0.8, metalness:0.05, transparent:true, opacity:0.95 })
];
const matBench = new THREE.MeshStandardMaterial({ color:0x5a3a2a, roughness:0.8, metalness:0.1 });
const matLamp = new THREE.MeshStandardMaterial({ color:0x3a2a20, roughness:0.65, metalness:0.35 });
const matGlass = new THREE.MeshPhysicalMaterial({ color:0xffffd0, transmission:0.95, thickness:0.1, roughness:0.02, metalness:0.0, ior:1.5, clearcoat:1, clearcoatRoughness:0.1 });

// --- Boden (größer) ---
const ground = new THREE.Mesh(new THREE.PlaneGeometry(80,80,1,1), matGround);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

// --- Bäume (3 Stück, größer) ---
function makeTree(x, z, scale=1, seed=0) {
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.35*scale, 0.55*scale, 4.5*scale, 8), matTrunk);
  trunk.position.y = 2.25*scale;
  trunk.castShadow = true;
  trunk.receiveShadow = true;
  g.add(trunk);
  
  for(let i=0;i<4;i++){
    const h = 1.5*scale + i*1.2*scale;
    const r = (1.1 - i*0.18)*scale;
    const cone = new THREE.Mesh(new THREE.ConeGeometry(r, h, 8), matLeaf[(seed+i)%4]);
    cone.position.y = 4.5*scale + h/2 + i*0.35*scale;
    cone.castShadow = true;
    cone.receiveShadow = true;
    g.add(cone);
  }
  g.position.set(x, 0, z);
  g.userData = { seed, scale };
  return g;
}
const tree1 = makeTree(-8, -5, 1.2, 0);
const tree2 = makeTree(9, -7, 1.0, 2);
const tree3 = makeTree(-3, 10, 1.4, 1);
const tree4 = makeTree(6, 8, 0.9, 3);
scene.add(tree1, tree2, tree3, tree4);

// --- Bank ---
const bench = new THREE.Group();
const seat = new THREE.Mesh(new THREE.BoxGeometry(3.5, 0.18, 0.8), matBench);
seat.position.y = 0.7; seat.castShadow = true; bench.add(seat);
const back = new THREE.Mesh(new THREE.BoxGeometry(3.5, 0.9, 0.14), matBench);
back.position.set(0, 1.15, -0.35); back.castShadow = true; bench.add(back);
for(let x of [-1.5, 1.5]){
  const leg = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.7, 0.14), matBench);
  leg.position.set(x, 0.35, 0.33); leg.castShadow = true; bench.add(leg);
  const leg2 = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.7, 0.14), matBench);
  leg2.position.set(x, 0.35, -0.33); leg2.castShadow = true; bench.add(leg2);
}
bench.position.set(-5, 0, 3);
bench.rotation.y = 0.5;
scene.add(bench);

// --- Laterne ---
const lamp = new THREE.Group();
const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.15, 6, 8), matLamp);
pole.position.y = 3; pole.castShadow = true; lamp.add(pole);
const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 3, 6), matLamp);
arm.rotation.z = -Math.PI/2; arm.position.set(1.3, 5.8, 0); arm.castShadow = true; lamp.add(arm);
const glass = new THREE.Mesh(new THREE.SphereGeometry(0.45, 20, 16), matGlass);
glass.position.set(2.8, 5.8, 0); glass.castShadow = true; lamp.add(glass);

const pointLight = new THREE.PointLight(0xffdd88, 500, 15, 2);
pointLight.position.set(2.8, 5.8, 0);
pointLight.castShadow = true;
pointLight.shadow.mapSize.set(256, 256);
lamp.add(pointLight);
lamp.position.set(10, 0, -8);
scene.add(lamp);

// --- Volumetric Light Cones (Raymarching) ---
const coneVertexShader = `
  varying vec3 vWorldPos;
  varying vec3 vLocalPos;
  void main(){
    vLocalPos = position;
    vec4 world = modelMatrix * vec4(position, 1.0);
    vWorldPos = world.xyz;
    gl_Position = projectionMatrix * viewMatrix * world;
  }
`;

const coneFragmentShader = `
  varying vec3 vWorldPos;
  varying vec3 vLocalPos;
  uniform vec3 uLightPos;
  uniform vec3 uLightDir;
  uniform float uLightAngle;
  uniform float uLightRange;
  uniform vec3 uLightColor;
  uniform float uTime;
  uniform mat4 uViewMatrix;
  uniform mat4 uProjMatrix;
  uniform vec3 uCamPos;
  
  // Simple hash
  float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
  float noise(vec2 p) { vec2 i = floor(p); vec2 f = fract(p); f = f*f*(3.0-2.0*f); return mix(mix(hash(i), hash(i+vec2(1,0)), f.x), mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), f.x), f.y); }
  float fbm(vec2 p) { float v=0.0, a=0.5; for(int i=0;i<4;i++){ v+=a*noise(p); p*=2.0; a*=0.5; } return v; }
  
  // Signed distance to infinite cone (axis aligned with -y in local space)
  float sdCone(vec3 p, float h, float r) {
    vec2 q = vec2(length(p.xz), p.y);
    vec2 k = vec2(r, h);
    vec2 w = q - k * clamp(dot(q, k) / dot(k, k), 0.0, 1.0);
    return length(w) * sign(max(w.x, w.y));
  }
  
  void main(){
    // Ray from camera through this fragment
    vec3 ro = uCamPos;
    vec3 rd = normalize(vWorldPos - ro);
    
    // Transform ray to cone local space (cone points along -y, tip at origin)
    // We'll build a matrix from lightPos and lightDir
    vec3 zAxis = normalize(-uLightDir);
    vec3 xAxis = normalize(cross(vec3(0,1,0), zAxis));
    if (length(xAxis) < 0.1) xAxis = vec3(1,0,0);
    vec3 yAxis = cross(zAxis, xAxis);
    mat3 rot = mat3(xAxis, yAxis, zAxis); // columns
    
    vec3 roLocal = rot * (ro - uLightPos);
    vec3 rdLocal = rot * rd;
    
    // Cone parameters: height = uLightRange, radius at base = uLightRange * tan(uLightAngle)
    float h = uLightRange;
    float r = uLightRange * tan(uLightAngle);
    
    // Raymarch
    float t = 0.0;
    float maxDist = uLightRange + 10.0;
    float density = 0.0;
    for(int i=0; i<64; i++){
      vec3 p = roLocal + rdLocal * t;
      float d = sdCone(vec3(p.x, p.y, p.z), h, r);
      // Wind distortion: bend cone along x based on height and time
      float wind = fbm(vec2(p.y * 0.5, uTime * 0.3)) * 0.3 * (p.y / h);
      d -= abs(wind);
      if (d < 0.0) {
        // Inside cone: accumulate density
        float localDensity = exp(-max(d, 0.0) * 10.0) * (1.0 - t / maxDist);
        // Add some noise for particulate look
        localDensity *= 0.5 + 0.5 * noise(vec2(p.x * 2.0 + uTime, p.z * 2.0 - uTime));
        density += localDensity * 0.05;
      }
      t += max(d, 0.01);
      if (t > maxDist) break;
    }
    
    vec3 color = uLightColor * density;
    // Add a subtle glow at the edges
    float edge = smoothstep(0.0, 0.1, abs(sdCone(roLocal + rdLocal * t, h, r)));
    color += uLightColor * (1.0 - edge) * 0.02;
    
    gl_FragColor = vec4(color, 1.0);
  }
`;

const coneMaterial = new THREE.ShaderMaterial({
  vertexShader: coneVertexShader,
  fragmentShader: coneFragmentShader,
  uniforms: {
    uLightPos: { value: new THREE.Vector3() },
    uLightDir: { value: new THREE.Vector3() },
    uLightAngle: { value: 0 },
    uLightRange: { value: 0 },
    uLightColor: { value: new THREE.Color() },
    uTime: { value: 0 },
    uViewMatrix: { value: new THREE.Matrix4() },
    uProjMatrix: { value: new THREE.Matrix4() },
    uCamPos: { value: new THREE.Vector3() }
  },
  transparent: true,
  depthWrite: false,
  side: THREE.BackSide,
  blending: THREE.AdditiveBlending // render inside of cone
});

// Create cone geometry (pointing down -Y)
const coneGeom = new THREE.ConeGeometry(1, 1, 32, 1, true);
coneGeom.rotateX(Math.PI/2); // now points along -Y

// Cone for first spotlight
const cone1 = new THREE.Mesh(coneGeom, coneMaterial);
cone1.scale.set(1, 1, 1); // will be set per frame
scene.add(cone1);

// Cone for second spotlight
const cone2 = new THREE.Mesh(coneGeom, coneMaterial.clone());
scene.add(cone2);

// --- Steuerung ---
let yaw = 0, pitch = 0.4, dist = 35;
const keys = {};
addEventListener('keydown', e => keys[e.code] = true);
addEventListener('keyup', e => keys[e.code] = false);

function updateCamera() {
  const speed = keys['ShiftLeft'] || keys['ShiftRight'] ? 0.6 : 0.2;
  if (keys['ArrowLeft']) yaw += speed * 0.02;
  if (keys['ArrowRight']) yaw -= speed * 0.02;
  if (keys['ArrowUp']) pitch = Math.min(1.3, pitch + speed * 0.02);
  if (keys['ArrowDown']) pitch = Math.max(-0.2, pitch - speed * 0.02);
  if (keys['Space']) camera.position.y += speed * 0.5;
  if (keys['ShiftLeft'] || keys['ShiftRight']) camera.position.y -= speed * 0.5;
  
  camera.position.x = Math.sin(yaw) * Math.cos(pitch) * dist;
  camera.position.z = Math.cos(yaw) * Math.cos(pitch) * dist;
  camera.position.y += Math.sin(pitch) * dist;
  camera.lookAt(0, 2, 0);
}

// --- Wind Animation für Bäume ---
function animateTrees(time) {
  [tree1, tree2, tree3, tree4].forEach((tree, idx) => {
    const seed = tree.userData.seed;
    const scale = tree.userData.scale;
    tree.children.forEach((child, i) => {
      if (i === 0) return; // trunk
      const sway = Math.sin(time * 0.7 + seed + i) * 0.08 * scale;
      child.rotation.z = sway;
      child.rotation.x = Math.cos(time * 0.5 + seed + i) * 0.04 * scale;
    });
  });
}

// --- Render Loop ---
let lastTime = 0;
function render(time) {
  time *= 0.001;
  updateCamera();
  animateTrees(time);
  
  // Update cone uniforms for spot1
  const spot1Dir = new THREE.Vector3().subVectors(spot.target.position, spot.position).normalize();
  cone1.position.copy(spot.position);
  cone1.quaternion.setFromUnitVectors(new THREE.Vector3(0, -1, 0), spot1Dir);
  cone1.scale.setScalar(spot.distance * Math.tan(spot.angle) * 2); // base diameter
  cone1.scale.y = spot.distance;
  
  coneMaterial.uniforms.uLightPos.value.copy(spot.position);
  coneMaterial.uniforms.uLightDir.value.copy(spot1Dir);
  coneMaterial.uniforms.uLightAngle.value = spot.angle;
  coneMaterial.uniforms.uLightRange.value = spot.distance;
  coneMaterial.uniforms.uLightColor.value.set(spot.color).multiplyScalar(spot.intensity * 0.0003);
  coneMaterial.uniforms.uTime.value = time;
  coneMaterial.uniforms.uViewMatrix.value.copy(camera.matrixWorldInverse);
  coneMaterial.uniforms.uProjMatrix.value.copy(camera.projectionMatrix);
  coneMaterial.uniforms.uCamPos.value.copy(camera.position);
  
  // Cone for spot2
  const spot2Dir = new THREE.Vector3().subVectors(spot2.target.position, spot2.position).normalize();
  cone2.position.copy(spot2.position);
  cone2.quaternion.setFromUnitVectors(new THREE.Vector3(0, -1, 0), spot2Dir);
  cone2.scale.setScalar(spot2.distance * Math.tan(spot2.angle) * 2);
  cone2.scale.y = spot2.distance;
  
  cone2.material.uniforms.uLightPos.value.copy(spot2.position);
  cone2.material.uniforms.uLightDir.value.copy(spot2Dir);
  cone2.material.uniforms.uLightAngle.value = spot2.angle;
  cone2.material.uniforms.uLightRange.value = spot2.distance;
  cone2.material.uniforms.uLightColor.value.set(spot2.color).multiplyScalar(spot2.intensity * 0.0003);
  cone2.material.uniforms.uTime.value = time;
  cone2.material.uniforms.uViewMatrix.value.copy(camera.matrixWorldInverse);
  cone2.material.uniforms.uProjMatrix.value.copy(camera.projectionMatrix);
  cone2.material.uniforms.uCamPos.value.copy(camera.position);
  
  // Flicker lantern
  pointLight.intensity = 500 + Math.sin(time * 3) * 50 + Math.sin(time * 7.3) * 30;
  
  renderer.render(scene, camera);
  requestAnimationFrame(render);
}
requestAnimationFrame(render);

// Info-Text
const info = document.getElementById('info');
info.innerHTML = '3D-Lichtspiel: Volumetrischer Herbstpark<br>Raymarching-Kegel mit Wind-Verzerrung<br>Laterne flackert, Bäume wiegen sich';
</script>
</body>
</html>
