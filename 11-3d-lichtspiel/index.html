<!DOCTYPE html>
<html lang="de">
<head><script type="module">import * as T from "https://unpkg.com/three@0.170.0/build/three.module.js"; window.THREE = T;</script>
<meta charset="UTF-8">
<title>3D-Lichtspiel – Herbstpark Volumetrisch</title>
<style>
  body { margin:0; background:#2a2018; display:flex; justify-content:center; align-items:center; height:100vh; font-family:monospace; color:#f0e0c0; overflow:hidden; }
  canvas { display:block; border:2px solid #6a5a3a; box-shadow:0 0 30px rgba(255,200,100,0.4); background:#1a1510; }
  #info { position:fixed; top:10px; left:10px; pointer-events:none; line-height:1.4; font-size:11px; text-shadow:0 0 3px #000; }
  #hud { position:fixed; bottom:10px; left:10px; right:10px; font-size:10px; opacity:0.8; text-align:center; color:#f0e0c0; }
</style>
</head>
<body>
<div id="info"></div>
<div id="hud">Pfeile: Kamera drehen | Leertaste: Hoch/Runter | Shift: Tempo | Herbstwind weht...</div>
<script type="module">
// ===== Fifo der Dodo bastelt: Volumetrischer Herbstpark (Raymarching mit Distanzfeld) =====
// Three.js r170 liegt global als THREE vor

const W = 400, H = 400;
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false });
renderer.setSize(W, H);
renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.8;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x2a2018, 0.008);

const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 200);
camera.position.set(0, 12, 28);

// --- Licht: Spotlight für Godrays ---
const spot = new THREE.SpotLight(0xffcc60, 3000, 50, Math.PI/4.5, 0.5, 1);
spot.position.set(5, 18, 10);
spot.target.position.set(0, 0, 0);
spot.castShadow = true;
spot.shadow.mapSize.set(1024, 1024);
spot.shadow.camera.near = 1;
spot.shadow.camera.far = 60;
spot.shadow.camera.fov = 55;
spot.shadow.bias = -0.0005;
spot.shadow.normalBias = 0.02;
scene.add(spot);
scene.add(spot.target);

// Zweites Spotlight für mehr Volumen
const spot2 = new THREE.SpotLight(0xffaa20, 1500, 40, Math.PI/5, 0.6, 1);
spot2.position.set(-8, 15, -5);
spot2.target.position.set(2, 0, -2);
spot2.castShadow = true;
spot2.shadow.mapSize.set(512, 512);
spot2.shadow.camera.near = 1;
spot2.shadow.camera.far = 50;
spot2.shadow.camera.fov = 50;
scene.add(spot2);
scene.add(spot2.target);

// Ambient heller
const amb = new THREE.AmbientLight(0x5a4a3a, 1.2);
scene.add(amb);

// Hemisphere für natürlicheres Licht
const hemi = new THREE.HemisphereLight(0xffeecc, 0x2a1a10, 0.8);
scene.add(hemi);

// --- Herbst-Materialien (kräftigere Farben) ---
const matGround = new THREE.MeshStandardMaterial({ color:0x3d2a1a, roughness:0.9, metalness:0.05 });
const matTrunk = new THREE.MeshStandardMaterial({ color:0x4a2a1a, roughness:0.85, metalness:0.1 });
const matLeaf = [
  new THREE.MeshStandardMaterial({ color:0xe86a2a, roughness:0.75, metalness:0.05, transparent:true, opacity:0.95 }),
  new THREE.MeshStandardMaterial({ color:0xf4a02a, roughness:0.75, metalness:0.05, transparent:true, opacity:0.95 }),
  new THREE.MeshStandardMaterial({ color:0xc87a2a, roughness:0.75, metalness:0.05, transparent:true, opacity:0.95 }),
  new THREE.MeshStandardMaterial({ color:0x8a5a2a, roughness:0.8, metalness:0.05, transparent:true, opacity:0.95 })
];
const matBench = new THREE.MeshStandardMaterial({ color:0x5a3a2a, roughness:0.8, metalness:0.1 });
const matLamp = new THREE.MeshStandardMaterial({ color:0x3a2a20, roughness:0.65, metalness:0.35 });
const matGlass = new THREE.MeshPhysicalMaterial({ color:0xffffd0, transmission:0.95, thickness:0.1, roughness:0.02, metalness:0.0, ior:1.5, clearcoat:1, clearcoatRoughness:0.1 });

// --- Boden (größer) ---
const ground = new THREE.Mesh(new THREE.PlaneGeometry(80,80,1,1), matGround);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

// --- Bäume (3 Stück, größer) ---
function makeTree(x, z, scale=1, seed=0) {
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.35*scale, 0.55*scale, 4.5*scale, 8), matTrunk);
  trunk.position.y = 2.25*scale;
  trunk.castShadow = true;
  trunk.receiveShadow = true;
  g.add(trunk);
  
  for(let i=0;i<4;i++){
    const h = 1.5*scale + i*1.2*scale;
    const r = (1.1 - i*0.18)*scale;
    const cone = new THREE.Mesh(new THREE.ConeGeometry(r, h, 8), matLeaf[(seed+i)%4]);
    cone.position.y = 4.5*scale + h/2 + i*0.35*scale;
    cone.castShadow = true;
    cone.receiveShadow = true;
    g.add(cone);
  }
  g.position.set(x, 0, z);
  return g;
}
scene.add(makeTree(-8, -5, 1.2, 0));
scene.add(makeTree(9, -7, 1.0, 2));
scene.add(makeTree(-3, 10, 1.4, 1));
scene.add(makeTree(6, 8, 0.9, 3));

// --- Bank ---
const bench = new THREE.Group();
const seat = new THREE.Mesh(new THREE.BoxGeometry(3.5, 0.18, 0.8), matBench);
seat.position.y = 0.7; seat.castShadow = true; bench.add(seat);
const back = new THREE.Mesh(new THREE.BoxGeometry(3.5, 0.9, 0.14), matBench);
back.position.set(0, 1.15, -0.35); back.castShadow = true; bench.add(back);
for(let x of [-1.5, 1.5]){
  const leg = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.7, 0.14), matBench);
  leg.position.set(x, 0.35, 0.33); leg.castShadow = true; bench.add(leg);
  const leg2 = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.7, 0.14), matBench);
  leg2.position.set(x, 0.35, -0.33); leg2.castShadow = true; bench.add(leg2);
}
bench.position.set(-5, 0, 3);
bench.rotation.y = 0.5;
scene.add(bench);

// --- Laterne ---
const lamp = new THREE.Group();
const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.15, 6, 8), matLamp);
pole.position.y = 3; pole.castShadow = true; lamp.add(pole);
const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 3, 6), matLamp);
arm.rotation.z = -Math.PI/2; arm.position.set(1.3, 5.8, 0); arm.castShadow = true; lamp.add(arm);
const glass = new THREE.Mesh(new THREE.SphereGeometry(0.45, 20, 16), matGlass);
glass.position.set(2.8, 5.8, 0); glass.castShadow = true; lamp.add(glass);

const pointLight = new THREE.PointLight(0xffcc60, 50, 10, 2);
pointLight.position.set(2.8, 5.8, 0);
pointLight.castShadow = true;
lamp.add(pointLight);
lamp.position.set(10, 0, -8);
scene.add(lamp);

// --- Volumetrischer Lichtkegel (Raymarching mit Distanzfeld) ---
// Wir erzeugen einen Kegel-Mesh, der den Spotlight-Kegel approximiert,
// und nutzen einen Custom-Shader, der im Fragment-Shader raymarched.
// Die Distanzfeldfunktion beschreibt einen unendlichen Kegel, den wir mit
// einer sinusförmigen Krümmung (Wind) verbiegen.

const coneHeight = 50;
const coneAngle = Math.PI/4.5; // wie spot.angle
const coneRadius = coneHeight * Math.tan(coneAngle);

const coneGeom = new THREE.ConeGeometry(coneRadius, coneHeight, 32, 1, true);
coneGeom.rotateX(Math.PI); // Spitze nach oben
coneGeom.translate(0, coneHeight/2, 0); // Basis in Ursprung

const coneMaterial = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uLightPos: { value: spot.position },
    uLightDir: { value: new THREE.Vector3().subVectors(spot.target.position, spot.position).normalize() },
    uLightColor: { value: new THREE.Color(0xffcc60) },
    uConeHeight: { value: coneHeight },
    uConeAngle: { value: coneAngle },
    uCameraPos: { value: camera.position }
  },
  vertexShader: `\n    varying vec3 vWorldPos;\n    void main(){\n      vWorldPos = (modelMatrix * vec4(position,1.0)).xyz;\n      gl_Position = projectionMatrix * viewMatrix * vec4(vWorldPos,1.0);\n    }\n  `,
  fragmentShader: `\n    varying vec3 vWorldPos;\n    uniform float uTime;\n    uniform vec3 uLightPos;\n    uniform vec3 uLightDir;\n    uniform vec3 uLightColor;\n    uniform float uConeHeight;\n    uniform float uConeAngle;\n    uniform vec3 uCameraPos;\n    \n    // Distanzfeld für einen geraden Kegel (Spitze bei uLightPos, Achse uLightDir)\n    float sdCone(vec3 p, float h, float angle){\n      // p in lokalem Koordinatensystem des Kegels: y entlang Achse, xz radial\n      float r = length(p.xz);\n      float d = r - p.y * tan(angle);\n      // Begrenzen auf Höhe\n      d = max(d, -p.y);\n      d = max(d, p.y - h);\n      return d;
    }\n    \n    // Krümmung: Wir verbiegen den Kegel durch einen Wind-Einfluss\n    // Einfache Sinus-Welle entlang der Höhe und um die Achse\n    vec3 bendCone(vec3 p, float h, float t){\n      float y = p.y;
      float wave = sin(y * 0.5 + t) * 0.15 * (y/h);
      // Krümmung in x-Richtung (könnte auch z sein)\n      p.x += wave;
      return p;
    }\n    \n    void main(){\n      // View-Ray von Kamera zum Fragment\n      vec3 ro = uCameraPos;
      vec3 rd = normalize(vWorldPos - ro);
      
      // Transformiere in Kegel-Lokalkoordinaten\n      // Basis: uLightPos, Achse: uLightDir\n      // Wir bauen eine Basis-Matrix\n      vec3 up = abs(uLightDir.y) < 0.9 ? vec3(0,1,0) : vec3(1,0,0);
      vec3 right = normalize(cross(up, uLightDir));
      vec3 fwd = uLightDir;
      mat3 toLocal = mat3(right, fwd, cross(fwd, right)); // Spalten: right, fwd, up
      
      vec3 localPos = toLocal * (vWorldPos - uLightPos);
      
      // Krümmung anwenden (in lokalen Koordinaten)\n      localPos = bendCone(localPos, uConeHeight, uTime);
      
      // Distanzfeld abfragen\n      float d = sdCone(localPos, uConeHeight, uConeAngle);
      
      // Einfache Volumendichte: exponentieller Abfall mit Distanz zum Kegelrand\n      float density = exp(-max(d,0.0) * 30.0);
      
      // Zusätzlich: Lichtabfall mit Höhe (Inverse Square approx)
      float heightAtten = 1.0 - smoothstep(0.0, uConeHeight, localPos.y);
      
      vec3 color = uLightColor * density * heightAtten * 0.8;
      
      // Additive Mischung (wir rendern den Kegel nach der Szene mit Blending)
      gl_FragColor = vec4(color, density * 0.6);
    }\n  `,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  side: THREE.BackSide // Wir schauen von innen in den Kegel
});

const lightCone = new THREE.Mesh(coneGeom, coneMaterial);
lightCone.position.copy(spot.position);
// Ausrichtung: Kegel zeigt entlang -y (da wir gedreht haben), also drehen wir so, dass -y auf uLightDir zeigt
const quat = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,-1,0), new THREE.Vector3().subVectors(spot.target.position, spot.position).normalize());
lightCone.quaternion.copy(quat);
scene.add(lightCone);

// --- Steuerung ---
let yaw = 0, pitch = 0.3, dist = 28;
const keys = {};
addEventListener('keydown', e => keys[e.code] = true);
addEventListener('keyup', e => keys[e.code] = false);

function updateCamera(){
  const speed = keys['ShiftLeft'] ? 0.5 : 0.1;
  if(keys['ArrowLeft']) yaw += speed;
  if(keys['ArrowRight']) yaw -= speed;
  if(keys['ArrowUp']) pitch = Math.min(1.4, pitch + speed);
  if(keys['ArrowDown']) pitch = Math.max(-0.5, pitch - speed);
  if(keys['Space']) camera.position.y += speed;
  if(keys['ShiftLeft'] && !keys['Space']) camera.position.y -= speed;
  
  camera.position.x = Math.sin(yaw) * Math.cos(pitch) * dist;
  camera.position.z = Math.cos(yaw) * Math.cos(pitch) * dist;
  camera.position.y = Math.sin(pitch) * dist + 12;
  camera.lookAt(0,0,0);
}

// --- Wind für Blätter (einfache Vertex-Animation via OnBeforeCompile) ---
const windTime = { value: 0 };
[matLeaf[0], matLeaf[1], matLeaf[2], matLeaf[3]].forEach(mat => {
  mat.onBeforeCompile = shader => {
    shader.uniforms.uWindTime = windTime;
    shader.vertexShader = shader.vertexShader.replace(
      '#include <begin_vertex>',
      `uniform float uWindTime;
      #include <begin_vertex>
      float h = position.y;
      float sway = sin(uWindTime * 0.7 + h * 2.0 + transformed.x * 0.5) * 0.03 * h;
      transformed.x += sway;
      transformed.z += sway * 0.5;`
    );
  };
});

// --- Animationsschleife ---
let last = performance.now();
function animate(now){
  const dt = (now - last) / 1000;
  last = now;
  
  updateCamera();
  
  // Windzeit
  windTime.value = now * 0.001;
  
  // Shader-Uniforms für Lichtkegel aktualisieren
  coneMaterial.uniforms.uTime.value = now * 0.001;
  coneMaterial.uniforms.uCameraPos.value.copy(camera.position);
  coneMaterial.uniforms.uLightPos.value.copy(spot.position);
  coneMaterial.uniforms.uLightDir.value.subVectors(spot.target.position, spot.position).normalize();
  
  // Laterne leicht schwingen
  lamp.rotation.y = Math.sin(now * 0.0005) * 0.05;
  pointLight.intensity = 50 + Math.sin(now * 0.003) * 10;
  
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

// Info-Text
const info = document.getElementById('info');
info.innerHTML = '3D-Lichtspiel: Volumetrischer Kegel mit Distanzfeld & Krümmung<br>Spotlight wirft Godrays, Laterne pulsiert';</script>
</body>
</html>
